# taxonomy/_corpus/stress-corpus.yaml -- P1-S1-T01
#
# The 90-benchmark taxonomy stress corpus of 03-taxonomy-build-process.md S3.2, allocated
# exactly as that section's table allocates it (not rebalanced). It is deliberately NOT
# representative: language, code, mathematics, reasoning-general and multimodal get two
# entries each as a regression check, and everything else is over-sampled.
#
# ENGINEERING-DESIGN IS ABSENT BY DECLARATION. 03 S3.2: the domain recon never surveyed the
# family, "so there is nothing to draw a representative pair from, and filling the row with
# guesses is the one thing this stage exists to prevent." Its subdomain list is validated
# instead by the Phase-0 scoping survey (data/surveys/engineering-design/_family-scoping.yaml,
# P0-S10-T03) and then by the new-family IRR rule in 03 S6.3. That survey has since found 22
# credible Tier-1 families, so the reason for the absence is now historical -- but adding the
# row would rebalance the corpus, which this task must not do. A reviewer may decide to.
#
# Two slots in 03 S3.2 are placeholders, and each resolution is recorded in `allocation_slot`:
# "a WMT/IWSLT-style MT shared task" (language) and "two arbitrary grand-challenge.org
# challenges" (medicine-health).
#
# `stress_test: true` marks the ten schema stress tests 03 S3.2 names in bold; each is in the
# corpus by construction. Every URL returned HTTP 200 and every primary paper was fetched on
# `verified_on`, and all 90 URLs were re-checked independently (200) on 2026-09-24. Eight
# entries have no primary paper and say why in `primary_paper_note`. `flags` records version
# mismatches and ambiguities found while resolving -- read them before classifying.
# Status: agent-drafted, awaiting review (P1-S1-T01 is agent-draft).

