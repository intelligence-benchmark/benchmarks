# taxonomy/crosswalks/pwc.yaml
#
# Papers with Code archive -> our identifiers. KEYS ONLY, UNDER THE QUARANTINE POSTURE (03 S2,
# 04 S9, 06 S3.9). The archive is tagged CC-BY-SA-4.0, which is viral, so PwC content never enters
# the repository: the dump lives in a gitignored cache, and the only thing the adapter writes is
# data/_crosswalk/pwc.csv with the four columns below. Names and ids are a matching oracle; every
# description is re-derived from the primary paper.
#
# This file therefore holds NO FREE TEXT FIELD: every value is an identifier, a path, a number or a
# boolean, each matching 06's CSV rule ^[A-Za-z0-9._:/-]{1,80}$. tests/test_crosswalks.py enforces
# it. Explanations belong in these comments, which are ours, never in a field.
#
# `use: match-only` marks a PwC field read to find a match and never stored.
#
# Authored by P0-S4-T09 from 03 S2 and 06 S3.9.

crosswalk: pwc
counterpart: pwc-archive
counterpart_licence: CC-BY-SA-4.0
relation: reconciliation-key
posture: identifier-only
output: data/_crosswalk/pwc.csv
columns: [our_id, pwc_id, match_method, match_score]
match_methods: [exact-name, hf-paperswithcode-id, arxiv-id, manual]
verified: false
updated: 2026-09-25

rows:
  - theirs: paperswithcode_id
    ours: Benchmark.external_ids.papers_with_code
    use: stored
    match_method: hf-paperswithcode-id
  - theirs: id
    ours: Benchmark.external_ids.papers_with_code
    use: stored
    match_method: manual
  - theirs: name
    ours: Benchmark.name
    use: match-only
    match_method: exact-name
  - theirs: arxiv_id
    ours: Source.url
    use: match-only
    match_method: arxiv-id
