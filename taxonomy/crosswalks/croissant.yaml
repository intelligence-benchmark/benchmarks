# taxonomy/crosswalks/croissant.yaml
#
# Our Benchmark fields <-> the schema.org terms MLCommons Croissant uses (04 S5, 02 S13).
#
# Croissant describes the DATASET behind a benchmark; we describe the benchmark -- tasks, metrics,
# protocol, conditions -- which is the layer Croissant does not have and the proposed
# `croissant-benchmark` extension would occupy. So `croissant_url` is stored as a link and never
# re-encoded, and dataset-level structure (columns, splits, formats, record counts) is not ours to
# duplicate (02 S13).
#
# The Croissant spec is CC BY-ND: we may publish a NAMESPACED extension and may never republish a
# modified spec (04 S5). Nothing in this file restates the spec; it names terms.
#
# The term column must equal schema/benchmark.py's CROISSANT_TERMS, which the extension serialiser
# reads. tests/test_crosswalks.py asserts the two agree, so this file cannot drift from the code.
#
# Authored by P0-S4-T09 from 02 S13 and 04 S5.

crosswalk: croissant
counterpart: MLCommons Croissant (schema.org vocabulary)
counterpart_url: https://mlcommons.org/croissant/
counterpart_licence: CC-BY-ND-4.0 (spec)
relation: crosswalk
verified: true
updated: 2026-09-25

rows:
  - ours: Benchmark.name
    theirs: "sc:name"
    fidelity: one-to-one
  - ours: Benchmark.description
    theirs: "sc:description"
    fidelity: one-to-one
  - ours: Benchmark.aliases
    theirs: "sc:alternateName"
    fidelity: one-to-one
  - ours: Benchmark.homepage
    theirs: "sc:url"
    fidelity: one-to-one
    note: 04 S5 fixes the YAML name; homepage is Croissant's url.
  - ours: Benchmark.license
    theirs: "sc:license"
    fidelity: one-to-one
  - ours: Benchmark.tags
    theirs: "sc:keywords"
    fidelity: one-to-one
  - ours: Benchmark.croissant_url
    theirs: "sc:subjectOf"
    fidelity: one-to-one
    note: A link to the dataset's own Croissant record, served by HuggingFace at /api/datasets/{name}/croissant.
