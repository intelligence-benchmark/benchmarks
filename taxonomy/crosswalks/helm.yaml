# taxonomy/crosswalks/helm.yaml
#
# The HELM scenario taxonomy -> ours, recorded as ANCESTRY, NEVER AS EQUIVALENCE (03 S2). HELM is
# the best existing cross-modality scenario vocabulary and we adopt its distinctions and cite it --
# "we took it from HELM" is worth far more than "we made it up" -- but it entered maintenance mode on
# 2026-06-01 and will not track new terms, so we inherit and then diverge. Every row therefore says
# `relation: ancestry`: our term descends from, or was checked against, the HELM one. It never says
# the two mean the same thing, and no adapter may translate one into the other on that basis.
#
# Four kinds of row:
#   project   a HELM sub-project, pointing at the domain family it informs (03 S2's list)
#   scenario  a HELM scenario category, pointing at the facet terms it is ancestor to
#   metric    a HELM metric group, pointing at our evaluation_method (02 S5)
#   field     a HELM run-spec field, pointing at the condition or claim field it prefigures (02 S5)
#
# UNVERIFIED. The scenario categories are the HELM paper's (Liang et al. 2022, arXiv 2211.09110) as
# recalled, not re-read against the current HELM site; the project list and the metric and field
# rows come from 02 S5 and 03 S2. ToRR's coverage is not recorded anywhere in the plan, so its row
# carries no candidates until someone reads it.
#
# Authored by P0-S4-T09 from 02 S5 and 03 S2.

crosswalk: helm
counterpart: Stanford CRFM HELM (scenario taxonomy)
counterpart_url: https://crfm.stanford.edu/helm/
counterpart_licence: MIT (code)
relation: ancestry
verified: false
updated: 2026-09-25

rows:
  # --- projects (03 S2) ---
  - helm: Capabilities
    kind: project
    ours: Benchmark.domain.primary
    candidates: [language, reasoning-general, mathematics, code]
    value_kind: domain-family
    relation: ancestry
  - helm: Safety
    kind: project
    ours: Benchmark.domain.primary
    candidates: [safety-alignment]
    value_kind: domain-family
    relation: ancestry
  - helm: VHELM
    kind: project
    ours: Benchmark.domain.primary
    candidates: [vision, multimodal]
    value_kind: domain-family
    relation: ancestry
  - helm: HEIM
    kind: project
    ours: Benchmark.domain.primary
    candidates: [vision]
    value_kind: domain-family
    relation: ancestry
    note: Text-to-image evaluation. Under 02 S11 rule 12 it is vision where the image is scored and multimodal only where the text-image correspondence is.
  - helm: MedHELM
    kind: project
    ours: Benchmark.domain.primary
    candidates: [medicine-health]
    value_kind: domain-family
    relation: ancestry
  - helm: AudioHELM
    kind: project
    ours: Benchmark.domain.primary
    candidates: [audio-speech]
    value_kind: domain-family
    relation: ancestry
  - helm: ToRR
    kind: project
    ours: Benchmark.domain.primary
    candidates: []
    value_kind: domain-family
    relation: ancestry

  # --- scenario categories (HELM paper; unverified) ---
  - helm: question answering
    kind: scenario
    ours: Benchmark.capability
    candidates: [knowledge-recall]
    relation: ancestry
  - helm: information retrieval
    kind: scenario
    ours: Benchmark.capability
    candidates: [context-integration]
    relation: ancestry
  - helm: summarization
    kind: scenario
    ours: Benchmark.domain.primary
    candidates: [language]
    value_kind: domain-family
    relation: ancestry
  - helm: sentiment analysis
    kind: scenario
    ours: Benchmark.domain.primary
    candidates: [language]
    value_kind: domain-family
    relation: ancestry
  - helm: toxicity detection
    kind: scenario
    ours: Benchmark.capability
    candidates: [harm-avoidance]
    relation: ancestry
  - helm: knowledge
    kind: scenario
    ours: Benchmark.capability
    candidates: [knowledge-recall, factual-precision]
    relation: ancestry
  - helm: reasoning
    kind: scenario
    ours: Benchmark.capability
    candidates: [deductive-reasoning, inductive-reasoning, quantitative-reasoning]
    relation: ancestry
    note: HELM's reasoning is one category; ours splits it, which is the divergence 03 S2 anticipates.
  - helm: disinformation
    kind: scenario
    ours: Benchmark.capability
    candidates: [honesty, harm-avoidance]
    relation: ancestry
  - helm: bias
    kind: scenario
    ours: Benchmark.domain.primary
    candidates: [safety-alignment]
    value_kind: domain-family
    relation: ancestry
  - helm: calibration
    kind: scenario
    ours: Benchmark.capability
    candidates: [calibration-uncertainty]
    relation: ancestry
  - helm: robustness
    kind: scenario
    ours: Benchmark.capability
    candidates: [adversarial-robustness, distribution-shift-generalization]
    relation: ancestry

  # --- metric groups (02 S5) ---
  - helm: exact_match
    kind: metric
    ours: Benchmark.evaluation_method
    candidates: [exact-match]
    relation: ancestry
  - helm: quasi_exact_match
    kind: metric
    ours: Benchmark.evaluation_method
    candidates: [exact-match]
    relation: ancestry
    note: Normalised matching; ours has no separate term.
  - helm: bleu
    kind: metric
    ours: Benchmark.evaluation_method
    candidates: [reference-metric]
    relation: ancestry

  # --- run-spec fields (02 S5) ---
  - helm: annotator
    kind: field
    ours: EvalConditions.judge_model
    relation: ancestry
    note: HELM records the scoring model; EEE cannot. The precedent for our judge_model.
  - helm: annotator_model_deployment
    kind: field
    ours: EvalConditions.judge_model_version
    relation: ancestry
  - helm: AdapterSpec
    kind: field
    ours: EvalConditions.sampling
    relation: ancestry
  - helm: model_deployment
    kind: field
    ours: ResultClaim.system
    relation: ancestry
  - helm: run_spec.name
    kind: field
    ours: Benchmark.external_ids.every_eval_ever
    relation: ancestry
    note: 02 S5 lists it beside EEE's evaluation_name as the equivalent identifier.
