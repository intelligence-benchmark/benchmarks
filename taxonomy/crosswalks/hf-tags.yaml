# taxonomy/crosswalks/hf-tags.yaml
#
# HuggingFace Space tag namespaces -> our fields. HINTS, NEVER GROUND TRUTH (03 S2, 06 S3.2): the
# tags are self-declared by Space authors and sparsely applied -- 128 of a 1,000-Space sample
# carried any `test:*` tag, 12.8% (06 S3.2 owns the census; cite it rather than restate it). Every
# row therefore carries `source: hf_space_tag`, the provenance stamp a suggestion arrives with, and
# lands as a `_suggested` value for a curator to confirm (02 S11 rule 3: no facet value is written
# to data/ by a machine).
#
# `candidates` lists the terms of the `ours` field a tag points towards; a curator picks one or
# none. `value_kind: domain-family` marks a row whose candidate is a domain FAMILY: a family is
# navigational, never assignable (02 S3), so it narrows the curator's choice of leaf.
#
# `count` is the tag's frequency in 06 S3.2's 1,000-Space sample of 2026-09-17. Normalise case
# before matching: `language:english` and `language:English` both occur.
#
# The meaning of `judge:auto` is read from the tag's name and 06's mapping, not from HF's own
# documentation (verified: false). Confirm it before the adapter trusts the candidate.
#
# Authored by P0-S4-T09 from 03 S2 and 06 S3.2.

crosswalk: hf-tags
counterpart: HuggingFace Hub Space tags (leaderboard namespaces)
counterpart_url: https://huggingface.co/spaces?filter=leaderboard
counterpart_licence: per-artifact
relation: hint
verified: false
updated: 2026-09-25

rows:
  # --- test: -> data.access (06: "as a _suggested hint, never directly") ---
  - tag: "test:public"
    ours: Benchmark.data.access
    candidates: [fully-open]
    count: 110
    source: hf_space_tag
  - tag: "test:private"
    ours: Benchmark.data.access
    candidates: [private-test-server, train-open-test-held-out]
    count: 18
    source: hf_space_tag

  # --- submission: -> Leaderboard.submission_process (06 S3.2) ---
  - tag: "submission:manual"
    ours: Leaderboard.submission_process
    candidates: [self-reported, maintainer-verified]
    count: 39
    source: hf_space_tag
    note: A manual route says who enters a result, not who checks it; both readings occur.
  - tag: "submission:automatic"
    ours: Leaderboard.submission_process
    candidates: [sandboxed-rerun]
    count: 27
    source: hf_space_tag
  - tag: "submission:semiautomatic"
    ours: Leaderboard.submission_process
    candidates: [maintainer-verified, sandboxed-rerun]
    count: 10
    source: hf_space_tag

  # --- judge: -> judge_model presence and kind (06 S3.2), and the method it implies ---
  - tag: "judge:auto"
    ours: EvalConditions.judge_model
    count: 73
    source: hf_space_tag
    note: A judge exists; its kind is not said.
  - tag: "judge:auto"
    ours: Benchmark.evaluation_method
    candidates: [model-graded-judge]
    count: 73
    source: hf_space_tag
  - tag: "judge:function"
    ours: Benchmark.evaluation_method
    candidates: [exact-match, execution-tests, reference-metric]
    count: 17
    source: hf_space_tag
    note: A scoring function, so no judge_model.
  - tag: "judge:vlm-judge"
    ours: EvalConditions.judge_model
    count: 4
    source: hf_space_tag
    note: The judge is a vision-language model.
  - tag: "judge:vlm-judge"
    ours: Benchmark.evaluation_method
    candidates: [model-graded-judge]
    count: 4
    source: hf_space_tag

  # --- eval: -> facet hints (06 S3.2) ---
  - tag: "eval:code"
    ours: Benchmark.domain.primary
    candidates: [code]
    value_kind: domain-family
    count: 76
    source: hf_space_tag
  - tag: "eval:math"
    ours: Benchmark.domain.primary
    candidates: [mathematics]
    value_kind: domain-family
    count: 30
    source: hf_space_tag
  - tag: "eval:safety"
    ours: Benchmark.domain.primary
    candidates: [safety-alignment]
    value_kind: domain-family
    count: 15
    source: hf_space_tag
  - tag: "eval:generation"
    ours: Benchmark.capability
    candidates: [generation-fidelity]
    count: 47
    source: hf_space_tag
