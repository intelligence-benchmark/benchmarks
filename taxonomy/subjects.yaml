# taxonomy/subjects.yaml
#
# Facet 4 of 8. Scaffolded empty by P0-S1-T01; terms are authored in P0-S1-T02 (domains)
# and P0-S2 (all others). Header keys are fixed by the FacetFile schema in
# _plan/04-data-model.md S16; `version` is the taxonomy version (03 S10), not the schema
# version. `facet_kind` takes `navigational` or `flat` per that same schema.

facet: subject
facet_kind: flat
version: 0.1.0
updated: 2026-09-22
description: >
  What kind of thing the benchmark was designed to evaluate. Populates
  `designed_for_subjects[]`. Drives comparability refusal and claim validation: a claim whose
  system type falls outside the benchmark's designed-for subjects is refused, not warned.

# Authored by P0-S2-T03 from 02 S6, which is the canonical enumeration.
#
# DESIGNED-FOR VERSUS ACTUALLY-EVALUATED. This vocabulary fills two different fields on
# two different entities: `designed_for_subjects[]` on a Benchmark, which is what the
# benchmark was BUILT to evaluate, and `subject_type` on a ResultClaim, which is what was
# ACTUALLY evaluated. They routinely disagree, and that disagreement is the whole reason
# the facet exists. Every inclusion test below is written for both readings.
#
# The asymmetry worth knowing before tagging: conflating a bare model with an agent
# scaffold is the most common and most misleading category error on public leaderboards,
# and it misleads in ONE direction. The scaffold is almost always better, is almost always
# shipped by the party with an incentive to publish, and is almost never described. A row
# reading "Model X -- 68.4%" when the run used a bespoke harness, five retries and a custom
# prompt template is not a lie in any individual field. It is a lie in the omission, and no
# field-level validation catches it. What catches it is this facet plus the EvalConditions
# scaffold reference: when subject_type is agent-scaffold and EvalConditions.scaffold is
# null, condition_completeness drops and the comparison view separates the claim from the
# bare-model claims rather than ranking them together.
#
# `source: own` marks the four terms 02 S6's changelog records as added here.

terms:
  - id: base-model
    label: Base model
    status: active
    introduced_in: 1.0.0
    definition: >
      A pretrained model evaluated by continuation, with no instruction tuning or post-training
      for task compliance.
    inclusion_test: >
      On a Benchmark, tag this if the protocol is designed to work against raw continuation. On
      a ResultClaim, tag it only if the evaluated artifact had no instruction post-training.
    exclusion_test: >
      Do NOT tag this if the system was prompted as an assistant and complied, and do NOT tag it
      merely because the provider calls the checkpoint a base model.
    examples:
      - ref: mmlu-pro
        qualifies: true
        why: >
          Designed to admit raw continuation scoring, which is why base-model numbers are
          reported for it at all.
      - ref: ifeval
        qualifies: false
        why: >
          NEAR MISS. Runs against any text model, but scores whether stated directions were
          obeyed, which presupposes instruction tuning.
    see_also: [instruction-tuned-model, hosted-inference-endpoint]

  - id: instruction-tuned-model
    label: Instruction-tuned model
    status: active
    introduced_in: 1.0.0
    definition: >
      A model post-trained to follow instructions, evaluated by prompting it directly with no
      external loop.
    inclusion_test: >
      On a Benchmark, tag this if the protocol expects a compliant assistant. On a ResultClaim,
      tag it if a single model answered with no harness, no tools and no retries.
    exclusion_test: >
      Do NOT tag this if a harness drove the model across turns, which is `agent-scaffold`, and
      do NOT tag it where tools were available, which is `tool-augmented-model`.
    examples:
      - ref: ifeval
        qualifies: true
        why: >
          Verifiable instruction constraints presuppose a model that takes instructions.
      - ref: gpqa-diamond
        qualifies: true
        why: >
          Single-turn prompting of a compliant model is the designed-for case.
      - ref: swe-bench-verified
        qualifies: false
        why: >
          NEAR MISS. Reported per model name throughout, but essentially every competitive
          result comes from a scaffold that edits, runs tests and retries. The leaderboard row
          names the model; the subject is the scaffold.
    see_also: [base-model, agent-scaffold, tool-augmented-model, reasoning-model]
    not_to_be_confused_with:
      - term: agent-scaffold
        distinction: >
          This is the most common and most misleading category error on public leaderboards, and
          it is asymmetric: the scaffold is almost always better, is almost always shipped by
          the party with an incentive to publish, and is almost never described.

  - id: reasoning-model
    label: Reasoning model
    status: active
    introduced_in: 1.0.0
    definition: >
      A model trained or configured to spend inference compute on explicit reasoning before
      answering, where the reasoning effort is a condition of the result.
    inclusion_test: >
      On a ResultClaim, tag this if a reasoning-effort or thinking-budget setting was part of
      the run and materially changes the number.
    exclusion_test: >
      Do NOT tag this if long output happens to be produced without a budget being set, and do
      NOT tag it where the extra compute comes from an external retry loop rather than from the
      model.
    examples:
      - ref: frontiermath
        qualifies: true
        why: >
          Results are reported per reasoning-effort setting because the setting moves the
          number.
      - ref: humanitys-last-exam
        qualifies: true
        why: >
          Reasoning effort is a first-class condition of any published figure.
      - ref: mmlu-pro
        qualifies: false
        why: >
          NEAR MISS. Reasoning models are evaluated on it, but the benchmark is not designed
          around a reasoning budget; the setting is a run condition, not the subject.
    see_also: [instruction-tuned-model, hosted-inference-endpoint]

  - id: tool-augmented-model
    label: Tool-augmented model
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      A model given access to tools but driven with no autonomous loop.
    inclusion_test: >
      Tag this if tools were available and used within a single directed exchange, without the
      system deciding on its own when to stop.
    exclusion_test: >
      Do NOT tag this if the system iterates autonomously towards a goal, which is
      `agent-scaffold`, and do NOT tag it where tools were offered but the protocol scores an
      answer produced without them.
    examples:
      - ref: critpt
        qualifies: true
        why: >
          Roughly 4% for a base model against roughly 10% with code tools; that gap is the
          entire reason this term exists.
      - ref: bixbench
        qualifies: true
        why: >
          Analysis requires executing notebook steps, but the protocol directs the work rather
          than leaving the loop to the system.
      - ref: tau2-bench
        qualifies: false
        why: >
          NEAR MISS. Tool calls throughout, but the system runs its own multi-turn loop against
          a policy, which is `agent-scaffold`.
    see_also: [instruction-tuned-model, agent-scaffold, retrieval-augmented-system]
    not_to_be_confused_with:
      - term: agent-scaffold
        distinction: >
          The discriminant is who decides when the work is finished. Tools without a loop are
          augmentation; a loop is a scaffold.

  - id: domain-specialist-model
    label: Domain-specialist model
    status: active
    introduced_in: 1.0.0
    definition: >
      A model post-trained or built for one field, evaluated on that field.
    inclusion_test: >
      Tag this if the artifact was specialised for a discipline and the benchmark is designed to
      test that specialisation.
    exclusion_test: >
      Do NOT tag this if a general model is merely evaluated on domain content, and do NOT tag
      it where the artifact emulates a physical process, which is `scientific-surrogate-model`.
    examples:
      - ref: medhelm
        qualifies: true
        why: >
          Clinical tasks designed to test models built for medicine, not general models
          incidentally answering clinical questions.
      - ref: healthbench
        qualifies: true
        why: >
          Constructed with physicians to test clinical competence specifically.
      - ref: gpqa-diamond
        qualifies: false
        why: >
          NEAR MISS. Graduate-level domain content across biology, physics and chemistry, but
          designed for general models; specialisation is not what it tests.
    see_also: [scientific-surrogate-model, instruction-tuned-model]

  - id: generative-media-model
    label: Generative media model
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      A model that produces images, video, audio or speech as its scored output.
    inclusion_test: >
      Tag this if the artifact under evaluation generates media and the score is a property of
      the generated media.
    exclusion_test: >
      Do NOT tag this if media is an input rather than the output, and do NOT tag it where a
      model scores someone else's media.
    examples:
      - ref: vbench
        qualifies: true
        why: >
          Sixteen dimensions scoring generated video directly.
      - ref: geneval
        qualifies: true
        why: >
          Scores generated images for compositional correctness.
      - ref: coco
        qualifies: false
        why: >
          NEAR MISS. Entirely visual, but the model consumes images and emits boxes and masks;
          nothing is generated.
    see_also: [scientific-surrogate-model]

  - id: scientific-surrogate-model
    label: Scientific surrogate model
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      A learned model that emulates a physical or chemical process in place of a simulation or
      measurement.
    inclusion_test: >
      Tag this if the artifact stands in for a solver, potential or forecast system, and is
      scored against what that process would have produced.
    exclusion_test: >
      Do NOT tag this if the model answers questions about science in language, and do NOT tag
      it where the artifact is a classical solver rather than a learned one.
    examples:
      - ref: matbench-discovery
        qualifies: true
        why: >
          Evaluates interatomic potentials standing in for DFT.
      - ref: weatherbench-2
        qualifies: true
        why: >
          Evaluates weather emulators against the operational forecast they replace.
      - ref: critpt
        qualifies: false
        why: >
          NEAR MISS. Research-level physics, but it evaluates language models reasoning about
          physics, not surrogates emulating it.
    see_also: [domain-specialist-model, classical-algorithm]
    not_to_be_confused_with:
      - term: classical-algorithm
        distinction: >
          A surrogate is learned and replaces a computation; a classical algorithm performs one.
          The comparator in both cases is often the same solver.

  - id: retrieval-augmented-system
    label: Retrieval-augmented system
    status: active
    introduced_in: 1.0.0
    definition: >
      A system in which a retrieval component and a model are evaluated together.
    inclusion_test: >
      Tag this if retrieval is inside the boundary of what is scored, so a change to the index
      changes the result.
    exclusion_test: >
      Do NOT tag this if retrieved material is supplied by the protocol identically to every
      entrant, and do NOT tag it where retrieval is one tool among many in an autonomous loop.
    examples:
      - ref: lab-bench
        qualifies: true
        why: >
          Practical research questions that require finding the right record, with retrieval
          inside the evaluated system.
      - ref: bixbench
        qualifies: false
        why: >
          NEAR MISS. Data must be located and used, but the supplied notebook environment is
          identical for every entrant, so retrieval is part of the protocol rather than of the
          system.
    see_also: [tool-augmented-model, agent-scaffold]

  - id: agent-scaffold
    label: Agent scaffold
    status: active
    introduced_in: 1.0.0
    definition: >
      A harness wrapping one or more models with an autonomous loop, memory, retries or tool
      orchestration.
    inclusion_test: >
      Tag this if the system decides for itself what to do next and when to stop. On a
      ResultClaim, tag it whenever a harness drove the run, even where the leaderboard row names
      only a model.
    exclusion_test: >
      Do NOT tag this if the loop is the benchmark's own driver applied identically to all
      entrants, and do NOT tag it where several independent agents negotiate, which is
      `multi-agent-system`.
    examples:
      - ref: osworld-2-0
        qualifies: true
        why: >
          Dozens of interdependent GUI actions against live application state, with the system
          choosing each one.
      - ref: terminal-bench
        qualifies: true
        why: >
          Results move several points on harness choice alone, which is the definition of the
          scaffold being the subject.
      - ref: arc-agi-3
        qualifies: true
        why: >
          The Community leaderboard permits harnesses and the Official one does not; the
          Foundation built two boards for exactly this distinction.
      - ref: gpqa-diamond
        qualifies: false
        why: >
          NEAR MISS. Frequently run inside agent harnesses, but the benchmark is designed for
          direct prompting and its human baseline assumes it.
    see_also: [instruction-tuned-model, multi-agent-system, tool-augmented-model]
    not_to_be_confused_with:
      - term: instruction-tuned-model
        distinction: >
          When subject_type is agent-scaffold and EvalConditions.scaffold is null,
          condition_completeness drops and the comparison view separates the claim from
          bare-model claims rather than ranking them together. That mechanism is why this
          boundary is worth enforcing.

  - id: multi-agent-system
    label: Multi-agent system
    status: active
    introduced_in: 1.0.0
    definition: >
      Several agents with distinct roles or objectives, evaluated on their joint behaviour.
    inclusion_test: >
      Tag this if more than one autonomous agent participates and the interaction between them
      affects the score.
    exclusion_test: >
      Do NOT tag this if one agent calls sub-models as tools, and do NOT tag it where the second
      party is a scripted environment.
    examples:
      - ref: tau2-bench
        qualifies: true
        why: >
          A simulated user is a second participant whose behaviour shapes the outcome.
      - ref: kaggle-game-arena
        qualifies: true
        why: >
          Models play each other, and the rating depends on the roster.
      - ref: osworld-2-0
        qualifies: false
        why: >
          NEAR MISS. Long autonomous episodes, but a single agent acts against an application;
          nothing else is deciding.
    see_also: [agent-scaffold, human-ai-team]

  - id: full-product-pipeline
    label: Full product pipeline
    status: active
    introduced_in: 1.0.0
    definition: >
      A shipped end-to-end product evaluated as delivered, including components its vendor does
      not describe.
    inclusion_test: >
      Tag this if what was evaluated is a commercial system as a user would encounter it, rather
      than a model or a harness that can be reconstructed.
    exclusion_test: >
      Do NOT tag this if the components are documented well enough to rebuild the run, and do
      NOT tag it where a hosted endpoint serves a single named model.
    examples:
      - ref: gdpval
        qualifies: true
        why: >
          Occupational deliverables are produced by whatever the entrant actually ships, graded
          blind against expert work.
      - ref: remote-labor-index
        qualifies: true
        why: >
          Scores completed remote work, with the pipeline that produced it opaque by
          construction.
      - ref: swe-bench-verified
        qualifies: false
        why: >
          NEAR MISS. Commercial coding products are evaluated on it, but the benchmark's
          designed-for subject is a reconstructible scaffold, not a shipped product.
    see_also: [agent-scaffold, hosted-inference-endpoint]

  - id: hosted-inference-endpoint
    label: Hosted inference endpoint
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      A provider-served endpoint whose identity includes how it is served, not only which model
      it names.
    inclusion_test: >
      Tag this if the evaluated artifact is addressed by a provider slug, so quantisation,
      serving stack and routing are part of what was measured.
    exclusion_test: >
      Do NOT tag this if the weights were run locally under known settings, and do NOT tag it
      where the endpoint is merely the delivery mechanism for a fully specified model.
    examples:
      - ref: lmarena
        qualifies: true
        why: >
          Entrants are served endpoints, and serving differences are inside the compared object.
      - ref: artificial-analysis
        qualifies: true
        why: >
          Measures endpoints as served, which is the stated subject rather than an artefact of
          it.
      - ref: frontiermath
        qualifies: false
        why: >
          NEAR MISS. Results come through provider APIs, but the benchmark's designed-for
          subject is the model and reasoning setting, not the serving path.
    see_also: [base-model, instruction-tuned-model, full-product-pipeline]
    not_to_be_confused_with:
      - term: base-model
        distinction: >
          Epoch's corpus carries 927 distinct model-version strings that are provider-endpoint
          slugs mixing model identity, hosting provider and reasoning effort into one token.
          What was evaluated was an endpoint; pretending otherwise is how quantised or
          differently-served variants get compared as if they were the same system.

  - id: rl-policy
    label: RL policy
    status: active
    introduced_in: 1.0.0
    definition: >
      A learned control policy evaluated by acting in an environment.
    inclusion_test: >
      Tag this if the artifact is a policy trained by interaction and scored on the behaviour it
      produces.
    exclusion_test: >
      Do NOT tag this if a language model is prompted to act without being trained on the
      environment, and do NOT tag it where the policy runs on hardware, which is
      `physical-robot-system`.
    examples:
      - ref: mujoco-gymnasium
        qualifies: true
        why: >
          Continuous-control policies scored on episodic return.
      - ref: atari-100k
        qualifies: true
        why: >
          Policies trained under a fixed interaction budget.
      - ref: craftax
        qualifies: false
        why: >
          NEAR MISS. An RL environment, but increasingly evaluated with prompted language
          agents, so the subject depends on the claim rather than the benchmark.
    see_also: [physical-robot-system, agent-scaffold]

  - id: classical-algorithm
    label: Classical algorithm
    status: active
    introduced_in: 1.0.0
    definition: >
      A non-learned method -- a solver, heuristic or analytical procedure -- evaluated on the
      same task as learned systems.
    inclusion_test: >
      Tag this if the entrant contains no learned component and is included for comparison.
    exclusion_test: >
      Do NOT tag this if the method has learned parameters, and do NOT tag it where a classical
      system provides the ground truth rather than competing.
    examples:
      - ref: matbench-discovery
        qualifies: true
        why: >
          Classical potentials and analytical methods are entered alongside learned ones.
      - ref: open-catalyst
        qualifies: true
        why: >
          Non-learned baselines compete directly in the same table.
      - ref: weatherbench-2
        qualifies: false
        why: >
          NEAR MISS. The ECMWF operational forecast is present throughout, but as the comparator
          the field is measured against rather than as a competing entrant.
    see_also: [scientific-surrogate-model]

  - id: physical-robot-system
    label: Physical robot system
    status: active
    introduced_in: 1.0.0
    definition: >
      A complete robot -- policy, body and sensors -- evaluated on real hardware.
    inclusion_test: >
      Tag this if the scored run happened on a physical machine, and record the hardware: it is
      part of the system under test.
    exclusion_test: >
      Do NOT tag this if the evaluation is simulated however faithfully, and do NOT tag it where
      hardware only collected the dataset.
    examples:
      - ref: a2rl-drone-championship
        qualifies: true
        why: >
          Fully physical racing; the airframe is inside the evaluated system.
      - ref: robotwin-2-0
        qualifies: true
        why: >
          The AgileX hardware track evaluates real arms, separately from the simulated track.
      - ref: libero
        qualifies: false
        why: >
          NEAR MISS. Manipulation across 130 tasks, but entirely in simulation with no physical
          arm in the protocol.
    see_also: [rl-policy]

  - id: human-expert
    label: Human expert
    status: active
    introduced_in: 1.0.0
    definition: >
      Credentialed humans evaluated on the same task as machine entrants.
    inclusion_test: >
      Tag this if qualified humans produced scored results under the benchmark's own protocol.
    exclusion_test: >
      Do NOT tag this if humans only authored or graded the benchmark, and do NOT tag it where a
      human worked alongside a system, which is `human-ai-team`.
    examples:
      - ref: casp16
        qualifies: true
        why: >
          Human-expert groups are ranked in a separate category from automated servers, so the
          same method can appear twice with different numbers.
      - ref: osworld-2-0
        qualifies: true
        why: >
          A stated human baseline of 72.4% is a scored human result, and the top 2026 runs at
          73.1 to 82.6% have inverted the gap.
      - ref: healthbench
        qualifies: false
        why: >
          NEAR MISS. Built with 262 board-certified physicians, but they authored the rubric
          rather than sitting the benchmark.
    see_also: [human-nonexpert, human-ai-team]

  - id: human-nonexpert
    label: Human non-expert
    status: active
    introduced_in: 1.0.0
    definition: >
      Humans without domain credentials evaluated on the same task as machine entrants.
    inclusion_test: >
      Tag this if untrained humans produced scored results under the benchmark's protocol.
    exclusion_test: >
      Do NOT tag this if crowd workers rated outputs rather than attempting the task, and do NOT
      tag it where a qualification screen was applied.
    examples:
      - ref: arc-agi-3
        qualifies: true
        why: >
          Human solve rates from untrained participants are published as the reference the
          benchmark is calibrated against.
      - ref: minerl-basalt
        qualifies: false
        why: >
          NEAR MISS. Non-expert humans throughout, but as judges comparing agent behaviour
          rather than as entrants attempting the task.
    see_also: [human-expert, human-ai-team]

  - id: human-ai-team
    label: Human-AI team
    status: active
    introduced_in: 1.0.0
    definition: >
      A human and a system working together, evaluated as one entrant.
    inclusion_test: >
      Tag this if the scored result was produced jointly and the protocol records the human
      involvement.
    exclusion_test: >
      Do NOT tag this if a human only configured or prompted the system before an unattended
      run, and do NOT tag it where human and machine entrants are scored separately.
    examples:
      - ref: casp16
        qualifies: true
        why: >
          Human-in-the-loop groups are a distinct entrant category; without that flag their rows
          are indistinguishable from automated servers.
      - ref: cache
        qualifies: true
        why: >
          Nominations are produced by teams combining computational prediction with
          medicinal-chemistry judgement.
      - ref: gdpval
        qualifies: false
        why: >
          NEAR MISS. Expert humans and systems both appear, but they are graded as separate
          entrants rather than as a joint one.
    see_also: [human-expert, multi-agent-system]

