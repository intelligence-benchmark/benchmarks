  # -------------------------------------------------------------- reasoning-general
  - id: reasoning-general
    label: General reasoning
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is a reasoning competence studied in its own right, independent
      of any application domain.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own literature treats the reasoning form --
      deduction, causality, planning, theory of mind -- as the object of study.
    exclusion_test: >
      Do NOT tag this if the reasoning is applied to a field that has its own family, and do NOT
      tag it where breadth across many subjects is the point, which is `general-intelligence`.
    examples:
      - ref: planbench
        qualifies: true
        why: >
          Plan construction studied as its own subject, in a deliberately content-free action
          model.
      - ref: gpqa-diamond
        qualifies: false
        why: >
          NEAR MISS. Demands hard reasoning, but over graduate-level domain content, and the
          benchmark's claim is about knowledge breadth.
    seed_target: 12
    core: false
    coverage_status: surveyed
    curation_posture: ingest-then-verify
    reviewer_signoff: none
