# taxonomy/domains.yaml
#
# Facet 1 of 8, the navigational spine. Scaffolded empty by P0-S1-T01; terms are authored in P0-S1-T02 (domains)
# and P0-S2 (all others). Header keys are fixed by the FacetFile schema in
# _plan/04-data-model.md S16; `version` is the taxonomy version (03 S10), not the schema
# version. `facet_kind` takes `navigational` or `flat` per that same schema.

facet: domain
facet_kind: navigational
version: 0.1.0
updated: 2026-09-22
description: >
  The navigational spine. Two levels, `family/subdomain`: a benchmark carries exactly one
  primary domain and any number of secondary domains. A bare family is a navigational node
  and is never assignable to `domain.primary` or `domain.secondary[]`. Crossed with the
  capability-group rollup, this facet supplies the rows of the coverage matrix.

terms:
  # -------------------------------------------------------------- biology-genetics
  - id: biology-genetics
    label: Biology and genetics
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose subject is a biological molecule, system or signal.
    inclusion_test: >
      Tag this as PRIMARY if the scored quantity concerns proteins, nucleic acids, cells,
      organisms or neural activity.
    exclusion_test: >
      Do NOT tag this if the subject is a small molecule evaluated as a drug candidate, which is
      `chemistry-materials/drug-discovery-admet`, and do NOT tag it where the endpoint is a
      clinical outcome, which is `medicine-health`.
    examples:
      - ref: casp16
        qualifies: true
        why: >
          Protein and nucleic-acid structure prediction, assessed across dozens of groups.
      - ref: proteingym
        qualifies: true
        why: >
          Deep mutational scanning assays scored by rank correlation.
      - ref: virtual-cell-challenge-2026
        qualifies: true
        why: >
          Zero-shot perturbation response in unseen cell lines.
      - ref: healthbench
        qualifies: false
        why: >
          NEAR MISS. Biomedical throughout, but the endpoint is clinical conversation quality,
          which is `medicine-health`.
    seed_target: 25
    core: true
    coverage_status: surveyed
    curation_posture: hand-curate
    reviewer_signoff: none
