  - id: vision/ocr-handwriting
    label: OCR and handwriting
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Transcribing printed or handwritten text in images into character sequences.
    examples: []
  - id: vision/medical-imaging-cv
    label: Medical imaging (computer vision)
    parent: vision
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Computer-vision methods evaluated on medical images where the score is a vision metric
      rather than a clinical outcome.
    examples: []
    not_to_be_confused_with:
      - term: medicine-health/medical-imaging-diagnostic
        distinction: >
          The discriminant is what the score means. A vision metric on medical images is
          vision/medical-imaging-cv; a score against a clinical reference standard, where the
          output is a diagnosis, is medicine-health/medical-imaging-diagnostic.

