  # -------------------------------------------------------------- audio-speech
  - id: audio-speech
    label: Audio and speech
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose input or output is an acoustic signal.
    inclusion_test: >
      Tag this as PRIMARY if the score measures what was recovered from, or produced as, audio.
    exclusion_test: >
      Do NOT tag this if the scored relation is between audio and language as two modalities,
      which is `multimodal/audio-language`, and do NOT tag it where the audio is only the
      delivery medium for a text task.
    examples:
      - ref: open-asr-leaderboard
        qualifies: true
        why: >
