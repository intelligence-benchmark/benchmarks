  # -------------------------------------------------------------- general-intelligence
  - id: general-intelligence
    label: General intelligence
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks whose claim is about breadth or novelty across many subjects rather than
      competence in one.
    inclusion_test: >
      Tag this as PRIMARY if the benchmark's own claim is coverage of many fields, or
      acquisition of tasks it was not built for.
    exclusion_test: >
      Do NOT tag this if the benchmark is broad but its claim is about one competence, and do
      NOT use this family as a home for benchmarks that were hard to place.
    examples:
      - ref: arc-agi
        qualifies: true
        why: >
          Novel-task acquisition with deliberately unhelpful surface similarity.
      - ref: mmlu-pro
        qualifies: true
        why: >
          Breadth across fourteen subjects is the entire claim.
      - ref: gpqa-diamond
        qualifies: true
        why: >
          Graduate-level breadth across three sciences with a stated chance baseline.
      - ref: frontiermath
        qualifies: false
        why: >
          NEAR MISS. Extremely hard and widely cited as a frontier measure, but its claim is
          mathematical competence specifically.
    seed_target: 12
    core: false
    coverage_status: surveyed
    curation_posture: ingest-then-verify
    reviewer_signoff: none
