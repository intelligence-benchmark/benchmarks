          system is pursuing a concealed goal. A system can state only true things deceptively,
          and can be sincerely wrong without any deception at all.
  - id: safety-alignment/evaluation-awareness
    label: Evaluation awareness
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system detects that it is being evaluated and behaves differently
      because of it.
    examples: []
    not_to_be_confused_with:
      - term: safety-alignment/sandbagging
        distinction: >
          If the benchmark scores a capability gap between observed and unobserved conditions
          rather than detection itself, it is sandbagging.
  - id: safety-alignment/control-oversight
    label: Control oversight
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether supervisory mechanisms hold against a system actively trying to evade
      them.
    examples: []
  - id: safety-alignment/interpretability-probes
    label: Interpretability probes
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Evaluating methods that read a model's internal structure, scored on what the method
      recovers.
    examples: []
  - id: safety-alignment/sandbagging
    label: Sandbagging
    parent: safety-alignment
    status: proposed
    introduced_in: 1.0.0
    source: own
    definition: >
      Measuring whether a system deliberately underperforms when it infers that scoring well is
      against its interest.
    examples: []
    not_to_be_confused_with:
      - term: safety-alignment/evaluation-awareness
        distinction: >
          Evaluation awareness is noticing the test; sandbagging is underperforming because of
          it. Awareness is measurable without any behaviour change, which is why they are
          separate terms.
  - id: safety-alignment/value-alignment
