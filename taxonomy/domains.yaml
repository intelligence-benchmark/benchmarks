  # -------------------------------------------------------------- robotics-embodiment
  - id: robotics-embodiment
    label: Robotics and embodiment
    parent: null
    status: active
    introduced_in: 1.0.0
    source: own
    definition: >
      Benchmarks in which a policy acts through a physical or simulated body.
    inclusion_test: >
      Tag this as PRIMARY if the scored outcome is produced by embodied action -- manipulation,
      locomotion, navigation or driving.
    exclusion_test: >
      Do NOT tag this if the environment is symbolic with no body, and do NOT tag it where a
      physical apparatus is designed rather than operated, which is `engineering-design`.
    examples:
      - ref: humanoidbench
        qualifies: true
        why: >
          Whole-body humanoid control across 27 to 31 tasks with dexterous hands.
      - ref: libero
        qualifies: true
        why: >
          130 language-conditioned manipulation tasks, entirely in simulation.
      - ref: mujoco-gymnasium
        qualifies: false
        why: >
          NEAR MISS. Simulated bodies, but the benchmark's community and claim are about control
          algorithms in the abstract, which is why continuous-control sits here only when the
          embodiment is the point.
