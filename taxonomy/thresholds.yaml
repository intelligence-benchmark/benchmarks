# taxonomy/thresholds.yaml
#
# Named constants, not literals. 12-analytics-and-trends.md owns both values and the reasoning
# that separates them; 04-data-model.md S12 prints them once and nowhere else. Anything that
# needs one references it BY NAME.
#
# They are constants rather than literals because a threshold typed as a number in five
# documents is a threshold that gets calibrated in one of them and diverges in the other four
# the first time real completeness data arrives -- which is exactly when it finally matters.
#
# `calibrated_on: null` is load-bearing and must not be filled in with today's date to make the
# file look finished. Neither value has been calibrated against measured data. The honest
# expectation after the Epoch ingest is a mean condition_completeness around 0.10 on a six-field
# profile, so APPROXIMATELY ZERO ingested claims will clear either floor. That is the intended
# behaviour, not a miscalibration: the bulk ingest is for coverage, and comparison is where
# credibility lives.
#
# Authored by P0-S2-T06 from 04 S12.

version: 0.1.0
updated: 2026-09-22
description: >
  Condition-completeness floors, referenced by name from every document that needs one.

declared_by: 12-analytics-and-trends.md
calibrated_on: null

thresholds:
  frontier_floor: 0.3
  comparison_floor: 0.4

meanings:
  frontier_floor: >
    The condition_completeness below which a claim is too thin to sit on a frontier line. A
    claim below it still renders everywhere else; it is excluded from the SOTA trace only.
  comparison_floor: >
    The condition_completeness below which a machine-ingested claim is hidden from comparison
    views while remaining fully visible in browse and search.
