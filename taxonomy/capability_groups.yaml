# taxonomy/capability_groups.yaml
#
# The coarse (column) axis of the coverage matrix: a strict partition of the 44 terms in
# capabilities.yaml into 13 groups, settled by D1 and enumerated in 02 S4.3, which is the
# canonical source. 19 domain families x 13 groups = 247 coarse cells, and the coarse grid
# is the ONLY grid permitted to publish gap claims.
#
# This is not a facet file: it has no `terms` list, nothing in data/ ever references a group
# id, and the rollup is computed at build time rather than hand-tagged.
#
# ADR REQUIRED (02 S11 rule 9). Moving a term between groups triggers no retro-tag pass and
# changes no benchmark record, but it silently re-shapes every published gap claim in the
# affected columns. That is why this file carries its own `version`, why that version is
# recorded in build/derived/manifest.json and cited with every published coverage figure,
# and why a regrouping is an ADR rather than an edit.

facet: capability_group
facet_kind: flat
version: 0.1.0
updated: 2026-09-22
description: >
  The thirteen coarse capability groups that form the column axis of the published coverage
  matrix. Derived, never hand-tagged: curators tag capability terms and the rollup is
  computed at build time.

groups:
  - id: knowledge-and-memory
    label: Knowledge & memory
    members:
      - knowledge-recall
      - factual-precision
      - memory-retention
      - context-integration
  - id: formal-quantitative-reasoning
    label: Formal & quantitative
    members:
