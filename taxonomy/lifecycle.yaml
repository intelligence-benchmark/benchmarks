# taxonomy/lifecycle.yaml
#
# Facet 6 of 8. Scaffolded empty by P0-S1-T01; terms are authored in P0-S1-T02 (domains)
# and P0-S2 (all others). Header keys are fixed by the FacetFile schema in
# _plan/04-data-model.md S16; `version` is the taxonomy version (03 S10), not the schema
# version. `facet_kind` takes `navigational` or `flat` per that same schema.

facet: lifecycle
facet_kind: flat
version: 0.1.0
updated: 2026-09-22
description: >
  Where the benchmark sits in its own life: lifecycle stage, activity, maintenance status and
  the contested flag. Drives the saturation wall and dead-benchmark signalling. `saturated` is
  derived and never hand-set; `maintenance_status` is derived from the probe protocol.

# Authored by P0-S2-T05 from 02 S7-S10, which is the canonical enumeration.
# Definitions only: 02 S11 rule 8 lets `examples: []` warn rather than fail while
# taxonomy/VERSION < 1.0.0, and the example pass is P1-S14-T06's.
#
# Two fields share this file -- lifecycle and activity -- so every term carries the
# `field` it belongs to. The third field of Facet 6, maintenance_status, is in
# taxonomy/maintenance.yaml because every one of its terms is derived.
#
# `lifecycle: saturated` is DERIVED and never hand-set; it carries its derivation rule
# inline. `contaminated` and `retracted` are hand-set and require evidence sources.
#
# `activity: unknown` and `data.contamination_risk: unknown` in
# taxonomy/data-properties.yaml are the same word in two vocabularies. They are in
# different files so check 9c does not see them, and taxonomy/homographs.yaml is not the
# place for them either -- that file is scoped to capability-versus-subdomain collisions
# and check 9d asserts its contents equal that computed set exactly. Both mean 'we have
# not established this', which is why neither may be read as a low-risk or closed state.

terms:

  # --- lifecycle -- 10 terms ---
  - id: proposed
    label: Proposed
    field: lifecycle
    status: active
    introduced_in: 1.0.0
    definition: >
      The benchmark has been announced or published but is not yet in use.
    examples: []
  - id: active
    label: Active
    field: lifecycle
    status: active
    introduced_in: 1.0.0
    definition: >
      The benchmark is in current use and results are still being produced against it.
    examples: []
  - id: mature
    label: Mature
    field: lifecycle
    status: active
    introduced_in: 1.0.0
    definition: >
      The benchmark is established and stable, with a settled result record and no expectation
      of structural change.
    examples: []
  - id: saturated
    label: Saturated
    field: lifecycle
    status: active
    introduced_in: 1.0.0
    derived: true
    definition: >
      Measured headroom has reached or passed 0.95, so the benchmark no longer discriminates
      between the systems at the top of it.
    derivation: >
      Computed from headroom_consumed >= 0.95 per 12-analytics-and-trends.md, using only claims
      that satisfy the three-part SOTA rule in 02 S8. Never hand-set. If either anchor is
      missing, the metric is unbounded, the claim count is below threshold or the scale is
      non-cardinal, headroom is null and lifecycle keeps its hand-set value.
    examples: []
  - id: under-revision
    label: Under revision
    field: lifecycle
    status: active
    introduced_in: 1.0.0
    definition: >
      The maintainer is correcting or reissuing the benchmark content, so a score reported
      without a version is not interpretable.
    examples: []
  - id: contaminated
    label: Contaminated
    field: lifecycle
    status: active
    introduced_in: 1.0.0
    definition: >
      The benchmark is compromised as an instrument by evidenced training-data leakage, and the
      value is hand-set and requires an evidence source.
    examples: []
  - id: superseded
    label: Superseded
    field: lifecycle
    status: active
    introduced_in: 1.0.0
    definition: >
      A later benchmark has replaced this one for its purpose, though the original remains
      coherent.
    examples: []
  - id: deprecated
    label: Deprecated
    field: lifecycle
    status: active
    introduced_in: 1.0.0
    definition: >
      The maintainer has advised against further use without necessarily withdrawing the
      material.
    examples: []
  - id: retracted
    label: Retracted
    field: lifecycle
    status: active
    introduced_in: 1.0.0
    definition: >
      The benchmark has been formally withdrawn by its maintainer, and the value is hand-set and
      requires an evidence source.
    examples: []
  - id: dormant
    label: Dormant
    field: lifecycle
    status: active
    introduced_in: 1.0.0
    definition: >
      The benchmark is neither maintained nor formally ended, and no activity has been observed
      for long enough that it should not be read as current.
    examples: []

  # --- activity -- 6 terms ---
  - id: accepting-submissions
    label: Accepting submissions
    field: activity
    status: active
    introduced_in: 1.0.0
    definition: >
      The benchmark is open to new submissions right now.
    examples: []
  - id: round-scheduled
    label: Round scheduled
    field: activity
    status: active
    introduced_in: 1.0.0
    definition: >
      A future competition round has been announced with a date but has not opened.
    examples: []
  - id: between-rounds
    label: Between rounds
    field: activity
    status: active
    introduced_in: 1.0.0
    definition: >
      The benchmark runs in editions and is currently between two of them.
    examples: []
  - id: leaderboard-live-no-round
    label: Leaderboard live, no round
    field: activity
    status: active
    introduced_in: 1.0.0
    definition: >
      The leaderboard remains open and accepts results while no formal competition round is
      running, which is a common state that would otherwise be indistinguishable from dormancy.
    examples: []
  - id: closed
    label: Closed
    field: activity
    status: active
    introduced_in: 1.0.0
    definition: >
      The benchmark no longer accepts submissions of any kind.
    examples: []
  - id: unknown
    label: Unknown
    field: activity
    status: active
    introduced_in: 1.0.0
    definition: >
      The operational state has not been established, which is a statement about our observation
      rather than about the benchmark.
    examples: []
