# taxonomy/governance.yaml
#
# Facet 7 of 8. Scaffolded empty by P0-S1-T01; terms are authored in P0-S1-T02 (domains)
# and P0-S2 (all others). Header keys are fixed by the FacetFile schema in
# _plan/04-data-model.md S16; `version` is the taxonomy version (03 S10), not the schema
# version. `facet_kind` takes `navigational` or `flat` per that same schema.

facet: governance
facet_kind: flat
version: 0.1.0
updated: 2026-09-22
description: >
  Who maintains the benchmark, how results are submitted, and what independence relationships
  exist between the maintainer and the systems evaluated. Drives ecosystem analysis and the
  independence disclosure. Every independence flag except `no-known-conflict` requires a source.

# Authored by P0-S2-T05 from 02 S7-S10, which is the canonical enumeration.
# Definitions only: 02 S11 rule 8 lets `examples: []` warn rather than fail while
# taxonomy/VERSION < 1.0.0, and the example pass is P1-S14-T06's.
#
# Three fields share this file -- maintainer_type, submission_process and
# independence_flags -- so every term carries the `field` it belongs to.
#
# independence_flags is multi-valued and every value except `no-known-conflict` requires
# an evidence Source; CI enforces it. `no-known-conflict` means 'we looked and found
# none' and carries last_verified, so an entry with no flags is NOT the same as one
# flagged no-known-conflict and the interface shows the difference. None of these flags
# carries a valence in the rendering: no warning triangles, no red. Disclosure, never
# accusation.
#
# NOTE FOR P0-S2-T06. Five submission_process ids -- self-reported, maintainer-verified,
# sandboxed-rerun, held-out-server, third-party-audited -- are also rungs on the
# seven-rung ResultClaim.verification ladder that taxonomy/verification.yaml will carry.
# They are genuinely different things: this field describes the benchmark's submission
# PROCESS, the ladder grades an individual CLAIM's provenance, and a benchmark with a
# held-out server can still carry a self-reported claim. 02 S8 is explicit that
# conflating the two ladders is a known failure and already produced a rule naming an
# enum value that existed on neither.

terms:

  # --- governance.maintainer_type -- 9 terms ---
  - id: academic-lab
    label: Academic lab
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A university research group maintains the benchmark.
    examples: []
  - id: industry-lab
    label: Industry lab
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A commercial research organisation maintains the benchmark.
    examples: []
  - id: consortium
    label: Consortium
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A formally constituted multi-party body with a legal form maintains the benchmark.
    examples: []
  - id: standards-body
    label: Standards body
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A standards or certification organisation maintains the benchmark, which makes it slower,
      more procedural and materially more durable than a lab.
    examples: []
  - id: conference-workshop
    label: Conference or workshop
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      An organising committee that re-forms for each edition maintains the benchmark, making
      continuity dependent on individual volunteers.
    examples: []
  - id: nonprofit
    label: Nonprofit
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A nonprofit organisation outside the academic and standards systems maintains the
      benchmark.
    examples: []
  - id: government-agency
    label: Government agency
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A public body or national laboratory maintains the benchmark.
    examples: []
  - id: individual
    label: Individual
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      One person maintains the benchmark, with the key-person risk that implies.
    examples: []
  - id: community-collective
    label: Community collective
    field: governance.maintainer_type
    status: active
    introduced_in: 1.0.0
    definition: >
      A distributed group of contributors maintains the benchmark without the legal form a
      consortium has.
    examples: []

  # --- governance.submission_process -- 10 terms ---
  - id: self-reported
    label: Self-reported
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Participants report their own numbers and nothing in the process checks them.
    examples: []
  - id: maintainer-verified
    label: Maintainer verified
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      The maintainer checks a submitted result before it is published.
    examples: []
  - id: sandboxed-rerun
    label: Sandboxed re-run
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      The maintainer re-executes the submission in a controlled environment and publishes the
      number it produces.
    examples: []
  - id: held-out-server
    label: Held-out evaluation server
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Participants submit predictions and an evaluation server scores them against labels the
      participant never sees.
    examples: []
  - id: containerized-algorithm-submission
    label: Containerised algorithm submission
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Participants submit executable code in a container rather than predictions, so the
      leaderboard cannot be overfitted by inspection and entry requires working software.
    examples: []
  - id: assessment-committee
    label: Assessment committee
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      There is no leaderboard, and the output is a peer-reviewed assessment produced by a
      committee.
    examples: []
  - id: third-party-audited
    label: Third-party audited
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      An independent party other than the maintainer or the participant verifies the result.
    examples: []
  - id: live-arena
    label: Live arena
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Results emerge from continuous head-to-head comparison among entrants rather than from a
      fixed scored set.
    examples: []
  - id: physical-competition
    label: Physical competition
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Results are produced by entrants competing with physical hardware at a venue on a date.
    examples: []
  - id: publication-gated
    label: Publication gated
    field: governance.submission_process
    status: active
    introduced_in: 1.0.0
    definition: >
      Official ranking requires the entrant to submit an accompanying paper, which is an access
      condition nothing else in the schema carries.
    examples: []

  # --- governance.independence_flags -- 8 terms ---
  - id: no-known-conflict
    label: No known conflict
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      We looked for an independence conflict and found none, which is a statement about our
      search and its date rather than a guarantee that none exists.
    examples: []
  - id: maintainer-competes-on-own-benchmark
    label: Maintainer competes on own benchmark
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      The party maintaining the benchmark also submits systems evaluated by it.
    examples: []
  - id: funded-by-evaluated-party
    label: Funded by an evaluated party
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      The benchmark is funded by an organisation whose systems it evaluates.
    examples: []
  - id: prize-sponsored-by-industry
    label: Prize sponsored by industry
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      A commercial sponsor funds the prize pool for the benchmark or its competition.
    examples: []
  - id: evaluator-sells-evaluations
    label: Evaluator sells evaluations
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      The party producing the results sells evaluation as a commercial service.
    examples: []
  - id: single-evaluator-private-test-set
    label: Single evaluator, private test set
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      One party holds the evaluation set and runs every evaluation, which resists contamination
      and simultaneously prevents outside verification.
    examples: []
  - id: results-published-only-in-vendor-document
    label: Results published only in a vendor document
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      The results appear only inside a document controlled by the party being evaluated, such as
      a model card or system card.
    examples: []
  - id: commercial-leaderboard-placement
    label: Commercial leaderboard placement
    field: governance.independence_flags
    status: active
    introduced_in: 1.0.0
    definition: >
      Placement or visibility on the leaderboard can be influenced by a commercial arrangement.
    examples: []
