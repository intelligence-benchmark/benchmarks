# taxonomy/execution.yaml
#
# Facet 8 of 8. Scaffolded empty by P0-S1-T01; terms are authored in P0-S1-T02 (domains)
# and P0-S2 (all others). Header keys are fixed by the FacetFile schema in
# _plan/04-data-model.md S16; `version` is the taxonomy version (03 S10), not the schema
# version. `facet_kind` takes `navigational` or `flat` per that same schema.

facet: execution
facet_kind: flat
version: 0.1.0
updated: 2026-09-22
description: >
  What it costs to run the benchmark and how reproducible a run is: compute tier,
  reproducibility tier, the blockers that explain the tier, and harness availability. Drives
  the suite builder and scopes the local evaluation runner.

# Authored by P0-S2-T05 from 02 S7-S10, which is the canonical enumeration.
# Definitions only: 02 S11 rule 8 lets `examples: []` warn rather than fail while
# taxonomy/VERSION < 1.0.0, and the example pass is P1-S14-T06's.
#
# Four fields share this file -- compute_tier, reproducibility_tier,
# reproducibility_blockers and harness_availability -- so every term carries the `field`
# it belongs to.
#
# `wet-lab` APPEARS TWICE, once in compute_tier and once in reproducibility_blockers,
# and that is deliberate: 02 S10's changelog adds the compute tier 'paired with the
# wet-lab blocker'. The tier says the run costs bench work; the blocker says bench work
# is why nobody else can reproduce it. They are the same word answering two questions,
# which is exactly the arrangement 02 S11 rule 11 permits between vocabularies. Check 9c
# scopes id uniqueness to (file, field) for that reason.
#
# The tier says how hard reproduction is; the blockers say why, which is the only form
# the runner-layer scoping in 13-execution-runners.md can use.
#
# `inspect-evals-port` is NOT in harness_availability. It duplicated the separate
# inspect_evals_id field, so the enum and the id could disagree with nothing to catch it;
# inspect_evals_available is now derived from `inspect_evals_id != null`.

terms:

  # --- execution.compute_tier -- 12 terms ---
  - id: trivial-cpu
    label: Trivial CPU
    field: execution.compute_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      A full run completes on ordinary CPU hardware with no meaningful cost.
    examples: []
  - id: single-gpu
    label: Single GPU
    field: execution.compute_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      A full run needs one accelerator.
    examples: []
  - id: multi-gpu-node
    label: Multi-GPU node
    field: execution.compute_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      A full run needs several accelerators in one machine.
    examples: []
  - id: cluster
    label: Cluster
    field: execution.compute_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      A full run needs more than one machine.
    examples: []
  - id: api-credits-only
    label: API credits only
    field: execution.compute_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      The cost of a run is third-party inference spend rather than hardware.
    examples: []
  - id: simulator-required
    label: Simulator required
    field: execution.compute_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      A run needs a simulation environment, which is a dependency and a cost of its own.
    examples: []
  - id: physical-hardware
    label: Physical hardware
    field: execution.compute_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      A run needs real robots, instruments or devices rather than only computation.
    examples: []
  - id: physical-venue-entry
    label: Physical venue entry
    field: execution.compute_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      Participation means shipping hardware and people to a location on a fixed date, which is a
      cost class of its own.
    examples: []
  - id: wet-lab
    label: Wet lab
    field: execution.compute_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      A run needs laboratory bench work to produce the ground truth against which it is scored.
    examples: []
  - id: participant-funded-procurement
    label: Participant-funded procurement
    field: execution.compute_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      Entrants pay for physical materials to be bought or produced, so the barrier to entry is a
      materials budget rather than compute.
    examples: []
  - id: human-panel
    label: Human panel
    field: execution.compute_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      The cost of a run is paid human rater time rather than hardware or inference spend.
    examples: []
  - id: provided-allocation
    label: Provided allocation
    field: execution.compute_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      The organisers supply the compute, which inverts the usual cost model and makes the
      benchmark materially more accessible.
    examples: []

  # --- execution.reproducibility_tier -- 6 terms ---
  - id: fully-automatable
    label: Fully automatable
    field: execution.reproducibility_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      An independent party can reproduce a run end to end with no human or physical step.
    examples: []
  - id: automatable-with-simulator
    label: Automatable with a simulator
    field: execution.reproducibility_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      Reproduction is automatic but requires a specific simulation environment.
    examples: []
  - id: requires-specialized-hardware
    label: Requires specialised hardware
    field: execution.reproducibility_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      Reproduction requires hardware that is not generally available.
    examples: []
  - id: requires-human-raters
    label: Requires human raters
    field: execution.reproducibility_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      Reproduction requires recruiting and paying human judges.
    examples: []
  - id: requires-physical-experiment
    label: Requires a physical experiment
    field: execution.reproducibility_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      Reproduction requires running an experiment in the physical world.
    examples: []
  - id: not-independently-reproducible
    label: Not independently reproducible
    field: execution.reproducibility_tier
    status: active
    introduced_in: 1.0.0
    definition: >
      No party outside the maintainer can reproduce the result at all.
    examples: []

  # --- execution.reproducibility_blockers -- 10 terms ---
  - id: private-test-set
    label: Private test set
    field: execution.reproducibility_blockers
    status: active
    introduced_in: 1.0.0
    definition: >
      The evaluation labels are held by the maintainer and cannot be obtained.
    examples: []
  - id: unreleasable-data
    label: Unreleasable data
    field: execution.reproducibility_blockers
    status: active
    introduced_in: 1.0.0
    definition: >
      The underlying data cannot legally or ethically be released to a third party.
    examples: []
  - id: specific-simulator-build
    label: A specific simulator build
    field: execution.reproducibility_blockers
    status: active
    introduced_in: 1.0.0
    definition: >
      The score is defined only inside one build of a simulator, so a reproduction claim without
      that build identifier is false.
    examples: []
  - id: hardware-fleet
    label: A hardware fleet
    field: execution.reproducibility_blockers
    status: active
    introduced_in: 1.0.0
    definition: >
      Reproduction needs a fleet of physical machines rather than a single device.
    examples: []
  - id: human-raters
    label: Human raters
    field: execution.reproducibility_blockers
    status: active
    introduced_in: 1.0.0
    definition: >
      Reproduction needs human judgement that must be recruited and paid for.
    examples: []
  - id: wet-lab
    label: Wet-lab work
    field: execution.reproducibility_blockers
    status: active
    introduced_in: 1.0.0
    definition: >
      Reproduction needs laboratory bench work to regenerate the ground truth.
    examples: []
  - id: live-world-state
    label: Live world state
    field: execution.reproducibility_blockers
    status: active
    introduced_in: 1.0.0
    definition: >
      The task is defined against a world that keeps moving, so the same run cannot be repeated
      against the same conditions.
    examples: []
  - id: compute-scale
    label: Compute scale
    field: execution.reproducibility_blockers
    status: active
    introduced_in: 1.0.0
    definition: >
      The compute required puts reproduction out of reach for most independent parties.
    examples: []
  - id: no-reference-implementation
    label: No reference implementation
    field: execution.reproducibility_blockers
    status: active
    introduced_in: 1.0.0
    definition: >
      No runnable implementation is published, so reproduction starts by reconstructing the
      method from prose.
    examples: []
  - id: licence-restriction
    label: Licence restriction
    field: execution.reproducibility_blockers
    status: active
    introduced_in: 1.0.0
    definition: >
      The licence forbids the redistribution or use that independent reproduction would require.
    examples: []

  # --- execution.harness_availability -- 3 terms ---
  - id: official-harness
    label: Official harness
    field: execution.harness_availability
    status: active
    introduced_in: 1.0.0
    definition: >
      The maintainer publishes a runnable harness that produces the official score.
    examples: []
  - id: reference-implementation-only
    label: Reference implementation only
    field: execution.harness_availability
    status: active
    introduced_in: 1.0.0
    definition: >
      Code exists that demonstrates the method but is not an official scoring harness.
    examples: []
  - id: none
    label: None
    field: execution.harness_availability
    status: active
    introduced_in: 1.0.0
    definition: >
      No runnable code is published for this benchmark at all.
    examples: []
