# taxonomy/ceiling-anchors.yaml
#
# `data.ceiling_anchor_type`, ten terms. Part of Facet 5 (02 S7), kept in its own file
# per the layout in 05-repository-and-workflow.md S2. Header keys are fixed by the
# FacetFile schema in _plan/04-data-model.md S16.
#
# This is the CEILING side and is not the same vocabulary as `Baseline.kind`, which is
# the entity enum for a stored comparator record and carries three additional FLOOR
# values -- classical-algorithm, random-chance, field-practice-reference -- that have no
# place here. Nine of the ten below map one-to-one onto their Baseline.kind counterpart;
# `none-known` is the absence of a ceiling and is expressed on a stored record by
# `value_absent_reason` instead. 04 S7 owns that mapping and its spelling governs for a
# stored record, so the spellings there are human-crowd-average and so on while the
# facet terms here are bare. Do not reconcile them by editing one side.
#
# Four of the ten name an anchor that is not a person: theoretical-maximum,
# experimental-replicate, operational-system and noise-ceiling. That is why the field is
# `ceiling_anchor_type` and not the archive's `human_baseline_type`, which is forbidden
# by CI check 9a and recorded in taxonomy/forbidden-identifiers.yaml.
#
# Authored by P0-S2-T05 from 02 S7. Definitions only: 02 S11 rule 8 lets `examples: []`
# warn rather than fail while VERSION < 1.0.0, and the example pass is P1-S14-T06's.

facet: ceiling_anchor_type
facet_kind: flat
version: 0.1.0
updated: 2026-09-22
description: >
  What the top of a benchmark's scale is anchored to. Required for headroom computation;
  its absence is itself informative and must be rendered as such rather than silently
  producing a null headroom.

terms:

  # --- data.ceiling_anchor_type -- 10 terms ---
  - id: none-known
    label: None known
    field: data.ceiling_anchor_type
    status: active
    introduced_in: 1.0.0
    definition: >
      No ceiling anchor has been established for this benchmark, so headroom cannot be computed
      and its absence must be shown rather than rendered as a blank.
    examples: []
  - id: crowd-average
    label: Crowd average
    field: data.ceiling_anchor_type
    status: active
    introduced_in: 1.0.0
    definition: >
      The top of the scale is the mean performance of non-specialist human annotators.
    examples: []
  - id: crowd-best
    label: Crowd best
    field: data.ceiling_anchor_type
    status: active
    introduced_in: 1.0.0
    definition: >
      The top of the scale is the best performance achieved by a non-specialist human annotator.
    examples: []
  - id: expert-average
    label: Expert average
    field: data.ceiling_anchor_type
    status: active
    introduced_in: 1.0.0
    definition: >
      The top of the scale is the mean performance of qualified domain experts.
    examples: []
  - id: expert-best
    label: Expert best
    field: data.ceiling_anchor_type
    status: active
    introduced_in: 1.0.0
    definition: >
      The top of the scale is the best performance achieved by a qualified domain expert.
    examples: []
  - id: theoretical-maximum
    label: Theoretical maximum
    field: data.ceiling_anchor_type
    status: active
    introduced_in: 1.0.0
    definition: >
      The top of the scale is the metric's own upper bound rather than any measured performance.
    examples: []
  - id: measured-ceiling
    label: Measured ceiling
    field: data.ceiling_anchor_type
    status: active
    introduced_in: 1.0.0
    definition: >
      The top of the scale is an empirically measured limit on achievable performance given the
      data, rather than a bound derived from the metric.
    examples: []
  - id: experimental-replicate
    label: Experimental replicate
    field: data.ceiling_anchor_type
    status: active
    introduced_in: 1.0.0
    definition: >
      The top of the scale is the agreement between repeated runs of a physical experiment, so
      the hundred-per-cent anchor is an experiment rather than a person.
    examples: []
  - id: operational-system
    label: Operational system
    field: data.ceiling_anchor_type
    status: active
    introduced_in: 1.0.0
    definition: >
      The top of the scale is an incumbent production system, for which asking after a human
      baseline would be a category error.
    examples: []
  - id: noise-ceiling
    label: Noise ceiling
    field: data.ceiling_anchor_type
    status: active
    introduced_in: 1.0.0
    definition: >
      The top of the scale is the reliability limit of the measurement itself, above which any
      gain would be fitting noise.
    examples: []
