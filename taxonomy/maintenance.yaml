# taxonomy/maintenance.yaml
#
# `maintenance_status`, five terms. Part of Facet 6 (02 S8), kept in its own file per the
# layout in 05-repository-and-workflow.md S2. Header keys are fixed by the FacetFile
# schema in _plan/04-data-model.md S16.
#
# EVERY TERM HERE IS DERIVED. None is hand-set. The value is computed from dated probe
# signals under the protocol in 02 S8, which 07-ingestion-infrastructure.md implements:
# one record per signal per probe carrying signal_type, url, http_method, http_status,
# observed_at, value, consecutive_failures and probe_blocked. Anything less and this
# becomes the one facet the project cannot audit.
#
# Two asymmetries in the protocol are worth knowing before reading a value:
#
#   An unchanged undated-leaderboard fingerprint is a LOWER BOUND on staleness, never a
#   date. Until our own observation history for a benchmark exceeds 180 days it
#   contributes `unobservable` rather than `stale`, because publishing a staleness claim
#   on the strength of our own short memory is the same unsourced confidence the project
#   exists to oppose.
#
#   A blocked probe -- 401, 403, 429 or an anti-bot interstitial -- is NOT death. It sets
#   probe_blocked and contributes `unobservable`. OpenReview's API already returns 403 to
#   anonymous clients, so treating 403 as death would mark every OpenReview-hosted
#   benchmark abandoned on day one.
#
# Transitions toward `abandoned` are withheld for 30 days; transitions away publish
# immediately. `maintenance_status_contested` is a hand-set boolean requiring a source and
# is not part of this vocabulary.
#
# Authored by P0-S2-T05 from 02 S8. Definitions only, per 02 S11 rule 8.

facet: maintenance_status
facet_kind: flat
version: 0.1.0
updated: 2026-09-22
description: >
  Whether anyone is still looking after the benchmark, derived from dated probe signals
  rather than hand-set. No catalogue in the landscape marks a benchmark as dead, which is
  why this field exists.

terms:

  # --- maintenance_status -- 5 terms ---
  - id: actively-maintained
    label: Actively maintained
    field: maintenance_status
    status: active
    introduced_in: 1.0.0
    definition: >
      At least one observable maintenance signal is dated within the last 180 days.
    examples: []
  - id: slow
    label: Slow
    field: maintenance_status
    status: active
    introduced_in: 1.0.0
    definition: >
      The most recent observable maintenance signal is between 180 and 365 days old.
    examples: []
  - id: stale
    label: Stale
    field: maintenance_status
    status: active
    introduced_in: 1.0.0
    definition: >
      No observable maintenance signal has appeared for between 365 and 730 days.
    examples: []
  - id: abandoned
    label: Abandoned
    field: maintenance_status
    status: active
    introduced_in: 1.0.0
    definition: >
      No signal has appeared for 730 days or more, or any two of a dead homepage, an archived
      repository, a missing leaderboard and a removed dataset are confirmed under the probe
      protocol.
    examples: []
  - id: unobservable
    label: Unobservable
    field: maintenance_status
    status: active
    introduced_in: 1.0.0
    definition: >
      There is no repository, dataset page or dated leaderboard to probe, or every probe is
      blocked, so staleness cannot be measured at all.
    examples: []
