# taxonomy/domain-expectations.yaml
#
# The per-family denominator for coverage: how many Tier-1, field-defining benchmark families
# the domain reconnaissance believes EXIST. An input to curation_confidence, whose formula
# 12-analytics-and-trends.md S5.3 owns: 0.40 x entry coverage against the expectation here,
# 0.30 x the fraction of entries verified within 180 days, 0.30 x reviewer_signoff.
#
# THIS IS NOT THE SEED TARGET. The seed target is our allocation and lives in
# taxonomy/domains.yaml; this is an estimate of what exists. Conflating them is what made "~300"
# mean three things at once in an earlier revision. The thirteen sized rows total 300 against a
# realistic ceiling of roughly 4,710 families across all domains; the seed total is 320.
#
# SIX FAMILIES WERE NEVER SIZED. code, language, mathematics, reasoning-general, multimodal and
# engineering-design are absent from the recon's count table entirely. For those rows the
# denominator falls back to the family's seed target, and any chart using it MUST MARK THE CELL
# UNSIZED rather than quietly present a target-over-target ratio as a coverage fraction -- which
# would read as 100% coverage the moment the seed target is met. P0-S10-T03 owns sizing them.
#
# PROVENANCE, AND WHY IT IS ATTACHED. These denominators are one researcher's estimate made on
# 2026-09-17, not a measurement *(unverified -- confirm before relying on this)*. 15 S F is
# explicit that a coverage percentage with a guessed denominator is the single easiest way to
# publish a confident falsehood, so the denominator is rendered with its source and its
# uncertainty, never as a bare percentage. Every domain reviewer who signs off is expected to
# revise their own domain's number: a denominator nobody revises is a denominator that becomes
# a lie.
#
# Authored by P0-S2-T06 from 02 S3, which is the canonical copy of these numbers. The values are
# transcribed, not re-derived; 02 S3's table is itself generated from taxonomy/domains.yaml.

