# tests/build/fixtures/minimal (P0-S5-T05): the one published benchmark, curator-reviewed, with a
# three-level subset tree so materialisation is exercised: #chem overrides the domain, #chem-hard
# inherits #chem's domain and overrides capability, #plain overrides nothing.
id: alpha-bench
name: Alpha Bench
aliases:
  - AlphaBench
tagline: A published benchmark used in build tests.
released: 2025-03-01
domain:
  primary: code/repository-scale-se
  secondary:
    - reasoning-general/logical-deduction
capability:
  - deductive-reasoning
  - knowledge-recall
evaluation_method:
  - execution-tests
designed_for_subjects:
  - reasoning-model
learned_entrant_evidence:
  - system: Some Model
    source: src-alpha-paper
    observed_on: 2026-09-25
evaluation_target: learned-system
data:
  access: fully-open
headline_metric: accuracy
homepage: https://example.org/alpha
subsets:
  - id: alpha-bench#chem
    label: Chemistry
    domain_override:
      primary: chemistry-materials/reaction-prediction
  - id: alpha-bench#chem-hard
    label: Chemistry, hard split
    parent: alpha-bench#chem
    capability_override:
      - deductive-reasoning
    metric_override: exact-accuracy
  - id: alpha-bench#plain
    label: Plain
metrics:
  - accuracy
curation:
  added_by: a-curator
  added_on: 2026-09-25
  last_verified: 2026-09-25
  verification_status: curator-reviewed
  sources:
    - src-alpha-paper
