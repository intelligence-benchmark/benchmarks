# Hand-computed. An agentic benchmark (execution-tests x agent-scaffold -> the agentic profile, 11
# fields), a claim that answers eight of them. scaffold weighs 2.0, so the denominator is 12 and the
# three unknowns cost 3: (12 - 3) / 12 = 0.75. Tools are listed out of order; the key sorts them.
benchmark:
  evaluation_method: [execution-tests]
  designed_for_subjects: [agent-scaffold]
claim: {benchmark_version: swe-bench@verified, metric: resolved-rate, subset: verified}
conditions:
  id: cond-00000000000a
  shots: 0
  reasoning_effort: high
  reasoning_effort_raw: "high"
  tools_allowed: [search, bash, file-edit]
  scaffold: sys-x@1.2
  n_samples: 1
  selection_strategy: single
  sandbox: docker
  subset_used: verified
expected:
  profiles: [agentic]
  fields_material_total: 11
  unknown_fields: [chain_of_thought, harness, retries_allowed]
  key_unknown_count: 3
  condition_completeness: 0.75
  key_tuple: '["swe-bench@verified","resolved-rate","verified","?","?",1,"high","?","docker","sys-x@1.2","single",0,"verified",["bash","file-edit","search"]]'
