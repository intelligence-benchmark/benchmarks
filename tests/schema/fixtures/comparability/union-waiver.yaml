# Hand-computed. Two methods on one subject hit two profiles: execution-tests x agent-scaffold ->
# agentic (11), model-graded-judge x agent-scaffold -> model-graded (8, of which 4 are new): 15. The
# curator waives sandbox and adds max_steps: still 15. scaffold and judge_model weigh 2.0, so the
# denominator is 17; judge_model (2) and subset_used (1) are answered: 3 / 17.
benchmark:
  evaluation_method: [execution-tests, model-graded-judge]
  designed_for_subjects: [agent-scaffold]
  comparability:
    material_extra: [max_steps]
    material_waived:
      - field: sandbox
        reason: The harness runs every task in one fixed container the benchmark ships.
claim: {benchmark_version: b-bench@1, metric: score, subset: null}
conditions:
  id: cond-00000000000e
  judge_model: sys-judge@1
  subset_used: full
expected:
  profiles: [agentic, model-graded]
  fields_material_total: 15
  unknown_fields: [chain_of_thought, grading_rubric_ref, harness, judge_model_version, judge_prompt_hash, max_steps,
                   n_samples, reasoning_effort, retries_allowed, scaffold, selection_strategy, shots, tools_allowed]
  key_unknown_count: 13
  condition_completeness: 0.17647058823529413
  key_tuple: '["b-bench@1","score",null,"?","?","?","sys-judge@1","?","?","?","?","?","?","?","?","?","full","?"]'
