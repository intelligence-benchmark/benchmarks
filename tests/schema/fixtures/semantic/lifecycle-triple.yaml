# 02 S11 legality matrix. `saturated` has no fixture here: the Benchmark model already rejects a
# hand-set derived lifecycle term at tier 1, so no record reaching tier 3 can carry one.
pass:
  - benchmarks: [{lifecycle: active, activity: accepting-submissions}]
    derived: {example-bench: {maintenance_status: actively-maintained}}
  - benchmarks: [{lifecycle: dormant, activity: closed}]
    derived: {example-bench: {maintenance_status: abandoned}}
  - benchmarks: [{lifecycle: mature, activity: between-rounds}]
    derived: {example-bench: {maintenance_status: slow}}
fail:
  - benchmarks: [{lifecycle: dormant, activity: accepting-submissions}]         # the blocking combination
  - benchmarks: [{lifecycle: deprecated, activity: accepting-submissions}]
  - benchmarks: [{lifecycle: retracted, activity: accepting-submissions}]
  - benchmarks: [{lifecycle: active, activity: accepting-submissions}]          # abandoned, and no note
    derived: {example-bench: {maintenance_status: abandoned}}
warn:
  - benchmarks: [{lifecycle: active, activity: accepting-submissions,
                  curation: {notes: "The auto-grader still runs; the repo has had no commit since 2024."}}]
    derived: {example-bench: {maintenance_status: abandoned}}
