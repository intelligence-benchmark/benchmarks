# 02 S11 rule 4: CI warns, and names the dropped terms.
pass:
  - benchmarks: [{capability: [planning, knowledge-recall],
                  subsets: [{id: "example-bench#a", label: A, capability_override: [planning, quantitative-reasoning]}]}]
  - benchmarks: [{capability: [planning], subsets: [{id: "example-bench#a", label: A}]}]
warn:
  - benchmarks: [{capability: [planning, knowledge-recall],
                  subsets: [{id: "example-bench#a", label: A, capability_override: [planning]}]}]
