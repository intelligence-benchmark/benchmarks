# 14-roadmap Phase 0 / 04 S9 / P0-S5-T06: every quote is a substring of its source's committed
# quote_extract. The base record is ai-drafted-unverified (the model default), so an unmatched quote
# warns and offers the null; a reviewed record blocks. tests/test_quote_validator.py has the rest.
pass:
  - benchmarks: [{}]
  - benchmarks: [{learned_entrant_evidence: [{system: Some Model, source: src-x, observed_on: 2026-09-25,
                                              quote: 'Some  MODEL entered'}]}]           # normalised on both sides
    sources: [{id: src-x, quote_extract: 'Leaderboard: Some Model entered in 2026.'}]
  - benchmarks: [{task: {scoring: resolved if tests pass, scoring_source: src-x, scoring_quote: all tests pass}}]
    sources: [{id: src-x, quote_extract: 'Resolved when all tests pass.'}]
warn:
  - benchmarks: [{task: {scoring: resolved if tests pass, scoring_source: src-x, scoring_quote: a fabricated quote}}]
    sources: [{id: src-x, quote_extract: 'Resolved when all tests pass.'}]
  - benchmarks: [{task: {scoring: resolved, scoring_source: src-x, scoring_quote: all tests pass}}]
    sources: [{id: src-x, quote_extract: null}]                                          # no snapshot to check
fail:
  - benchmarks: [{task: {scoring: resolved if tests pass, scoring_source: src-x, scoring_quote: a fabricated quote},
                  curation: {verification_status: curator-reviewed}}]
    sources: [{id: src-x, quote_extract: 'Resolved when all tests pass.'}]
  # learned_entrant_evidence is required with at least one row, so its only row cannot be nulled.
  - benchmarks: [{learned_entrant_evidence: [{system: Some Model, source: src-x, observed_on: 2026-09-25,
                                              quote: a fabricated quote}]}]
    sources: [{id: src-x, quote_extract: 'Leaderboard: Some Model entered in 2026.'}]
