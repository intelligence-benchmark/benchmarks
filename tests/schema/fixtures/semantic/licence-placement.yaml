# 04 S9's firewall. Paths are repo-relative.
pass:
  - claims: [{path: data/claims/_ingested/epoch/example-bench/c.yaml, ingestion: {licence_class: permissive-attribution}}]
  - claims: [{path: data/claims/example-bench/c.yaml,
              ingestion: {licence_class: permissive-attribution, review_state: promoted, reviewed_by: a-curator,
                          reviewed_on: 2026-09-20}}]
  - claims: [{path: vendor/pwc-archive/claims/c.yaml, ingestion: {licence_class: share-alike}}]
fail:
  - claims: [{path: data/claims/_ingested/pwc/example-bench/c.yaml, ingestion: {licence_class: share-alike}}]
  - claims: [{path: data/claims/example-bench/c.yaml,
              ingestion: {licence_class: share-alike, review_state: promoted, reviewed_by: a-curator,
                          reviewed_on: 2026-09-20}}]
  - claims: [{path: data/claims/_ingested/radar/example-bench/c.yaml, ingestion: {licence_class: non-commercial}}]
  - claims: [{path: data/claims/example-bench/c.yaml, ingestion: {licence_class: permissive-attribution}}]  # not promoted
  - batches: [{path: data/_ingest/batches/b.yaml, licence: {class: no-redistribution, redistribution_permitted: false}}]
