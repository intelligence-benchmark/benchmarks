# docs/outreach/reviewer-contacts.yaml -- P1-S4-T02
#
# Where to send docs/outreach/reviewer-email.md, for the seven Core families, in 03 S12.1's
# priority order (robotics 1 ... audio-speech 7). Within a family: community routes first,
# then groups, then individuals, as 14-roadmap.md asks ("approach conference communities, not
# individuals cold").
#
# A `route` is the URL of a public page through which contact is made -- an organisers page, a
# contact form, a forum, an issue tracker -- never an e-mail address or a phone number: this
# file is public. An individual appears only for a public role tied to a venue or a benchmark,
# and only by an institutional page. Look up the current address on the route at send time.
#
# Every route was fetched on `checked_on` by the researcher and again, independently, by the
# assembler; `http_status` is the second fetch. A route is a starting point, not a promise that
# anyone there will answer. Status: agent-drafted, awaiting review (P1-S4-T02 is agent-draft).
#
# Unconfirmed: every GitHub issue tracker here showed "Issue creation is restricted in this
# repository" to a signed-out reader. That is probably a sign-in prompt, not a real restriction,
# but nobody has yet opened an issue signed in; prefer a Discussions or organisers route where
# a family has one.

