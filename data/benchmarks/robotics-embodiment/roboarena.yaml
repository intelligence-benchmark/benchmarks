# --- Identity of what is ranked ---------------------------------------------------------------

policy_identity:
  # Backend ids are not display names, and one of them is actively misleading.
  aliasing: true
  source: src-roboarena-site-bundle
  quote: 'f0={dreaming_zebra:"DreamZero","cosmos3-nano-policy":"balsomsoc","j2-vla":"Spirit v1.6",yckmtchl:"Cosmos3-Nano-Policy"}'
  trap: >
    The backend id `cosmos3-nano-policy` displays as "balsomsoc", and the policy displayed
    as "Cosmos3-Nano-Policy" has the backend id `yckmtchl`. Joining on either string alone
    attaches a rating to the wrong system. Claims must carry both ids.
  linked_paper_example:
    backend_id: dreaming_zebra
    display_name: DreamZero
    source: src-dreamzero-arxiv-abs
    quote: "We introduce DreamZero, a World Action Model (WAM) built upon a pretrained video diffusion backbone."
  open_source_flag_per_policy: true   # the board carries open_source; the paper planned separate boards
  open_source_source: src-roboarena-arxiv-html
  open_source_quote: "We plan to publish separate leaderboards for “all policies” and “open-source policies”"

# --- Taxonomy ---------------------------------------------------------------------------------

domain:
  primary: robotics-embodiment/manipulation
  secondary: [robotics-embodiment/embodied-instruction-following]
  secondary_basis: >
    Each A/B item is a scene plus a language instruction, and the policies are
    language-conditioned.
  secondary_source: src-roboarena-arxiv-html
  secondary_quote: "(e.g., a specific scene and language instruction)"
domain_considered_and_rejected:
  - term: robotics-embodiment/cross-embodiment-transfer
    reason: One embodiment only. The paper lists cross-embodiment as future work.
    source: src-roboarena-arxiv-html
    quote: "the experimental evaluations in this paper have focused on the DROID platform"
  - term: robotics-embodiment/sim2real-transfer
    reason: >
      Simulated environments exist for debugging before submission, but nothing scores the
      gap between simulated and real performance.

capability: [sensorimotor-control, grounding]
capability_basis:
  sensorimotor-control: Closed-loop control of a real arm; the score depends on the physical outcome.
  grounding: >
    Instructions name objects in a scene the evaluator built, and the preference depends on
    whether the right object was acted on. Weaker than a benchmark that isolates binding;
    reviewer's call.
capability_considered_and_rejected:
  - term: instruction-following
    reason: >
      Its IN clause requires that "the benchmark's own source claims instruction following".
      The sources claim generalist manipulation; compliance is not scored separately from
      task success.
  - term: distribution-shift-generalization
    reason: >
      IN requires inputs "drawn from a deliberately different distribution" with "the
      degradation" reported. Scenes are novel but not deliberately shifted, and nothing
      reports degradation against a training distribution. Closest near-miss.
  - term: long-horizon-execution
    reason: Evaluators pick the task; nothing requires ~10 dependent steps, and most reported tasks are single pick-and-place.

evaluation_method: [physical-trial, pairwise-preference-elo]
evaluation_method_considered_and_rejected:
  - term: human-expert-eval
    reason: >
      Raters are volunteer evaluators with no stated qualification requirement, and the
      ranked number is a rating fitted to preferences rather than per-output ratings. The
      human judgement is inside pairwise-preference-elo, not beside it. 02 S12.2 tags both.
  - term: human-crowd-eval
    reason: OUT clause, verbatim -- "do NOT tag it where the aggregation is a head-to-head rating system".

designed_for_subjects: [physical-robot-system]
designed_for_subjects_note: >
  rl-policy's OUT clause sends a policy running on hardware to physical-robot-system. But
  here the submitter provides only the policy; the body is the evaluator's, and differs per
  item. The term's own IN clause says "record the hardware: it is part of the system under
  test" -- and the hardware is not the submitter's. The subject is really a remotely served
  policy evaluated on someone else's robot.
hardware:
  source: src-roboarena-arxiv-html
  quote: "which consists of a Franka Panda 7DoF robot arm, a Robotiq 2F-85 parallel-jaw gripper, a ZED-mini stereo wrist camera and one or multiple external ZED 2 stereo cameras"
designed_for_subjects_considered_and_rejected:
  - term: rl-policy
    reason: Its OUT clause, and most listed policies are VLAs fine-tuned on demonstrations, not RL.
  - term: hosted-inference-endpoint
    reason: >
      Near-miss. Policies are queried as remote servers and the board tracks their uptime,
      so how a policy is served does affect whether it is evaluated at all. But the rating
      is about the policy, not the endpoint.

# --- Admissibility (04 S5; 00 S6 A5) -- added by P0-S4-T03 with the user's approval ---------
# The learned-entrant test: in scope because at least one entrant is a learned system, and
# the entry cites where that is shown. Quoted from a source this entry already relied on.

learned_entrant_evidence:
  - system: DreamZero                  # ranked on the board as backend id dreaming_zebra
    source: src-dreamzero-arxiv-abs
    quote: "We introduce DreamZero, a World Action Model (WAM) built upon a pretrained video diffusion backbone."
    observed_on: 2026-09-23
evaluation_target: learned-system

# --- Data -------------------------------------------------------------------------------------

data:
  access: generated-on-demand
  access_note: >
    There is no evaluation set to access. Items exist only when an evaluator runs them.
    02 S12.2 says fully-open; that describes the evaluation RECORDS, not the items.
  records_access: fully-open
  records_access_source: src-roboarena-hf-api
  records_access_quote: '"gated":false'
  records_licence: MIT
  records_snapshot: 2026-07-17
  refresh: rolling-live
  data_provenance: []   # not yet tagged: the right term, evaluator-improvised, is not in the
                        # vocabulary (02 S11 rule 7); held in tags[] until it is. See _schema_findings
  data_provenance_note: >
    Items are authored on the spot by volunteer evaluators in their own scenes.
    crowd-authored ("non-specialist annotators at scale") and real-world-instrument
    ("recordings captured from physical sensors") each capture half of it.
  contamination_risk: low
  contamination_risk_basis: >
    An item does not exist until an evaluator builds it, which is what the vocabulary means
    by contamination-resistant by construction. Not recorded: whether evaluator scenes
    resemble DROID training scenes, which would be in-distribution rather than contaminated.

