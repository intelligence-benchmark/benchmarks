# data/benchmarks/robotics-embodiment/roboarena.yaml
#
# P0-S3-T03. Written from the primary sources below with NO schema in front of the author
# (14-roadmap "Start here", Week 2 item 4). Field names are invented where the entry needed
# them; P0-S5 reconciles them. `_schema_findings` at the bottom is the product of this task.
#
# The site is a single-page app with no server-rendered text. Its prose, its display-name
# table and its API base URL were read from the published JS bundle; the leaderboard and
# the evaluation counts from the public API the site itself calls. Both are `extract: raw`.
#
# PRIVACY. The public transparency endpoint lists evaluator accounts by e-mail address. This
# entry uses only aggregate counts from it. No evaluator name or address appears here, and
# none may be added: 05 S4's "no field without a source" is not a licence to republish
# personal data that a source happens to expose.
#
# 02 S12.2 disagrees with the sources in five places; each is recorded where it bites:
# submission_process, independence_flags, two secondary domains, and the capability list.

id: roboarena
name: RoboArena
tagline: Robot policies ranked from double-blind A/B trials that volunteer labs run on their own tasks and robots.
platform: DROID

description: >
  Submitters host a manipulation policy as a remote policy server. Volunteer evaluators at
  institutions with a DROID robot are handed two anonymised policies, choose any task and
  scene they like, run both under the same conditions, and record which they preferred,
  a 0-100 progress score for each, and a free-text explanation. A Bradley-Terry-style model
  with ties aggregates the preferences into a relative rating. There is no task list, no
  fixed test set and no absolute score.

released: 2025-06-22                  # arXiv v1
paper:
  title: "RoboArena: Distributed Real-World Evaluation of Generalist Robot Policies"
  arxiv: "2506.18123"
  version_read: v2
  source: src-roboarena-arxiv-abs
homepage: https://robo-arena.github.io/
repository: https://github.com/robo-arena/roboarena
api_url: https://roboarena-api-domain-name.online/api
dataset_url: https://huggingface.co/datasets/RoboArena/DataDump_07-17-2026

self_description:
  source: src-roboarena-site-bundle
  quote: "RoboArena is a community-run, real-world benchmark for evaluating generalist robot policies, instantiated currently on the DROID robot platform."

# --- What an "item" is, when there is no task list ---------------------------------------------

task:
  exists: false
  item_definition: >
    One A/B evaluation: a pair of policies, one evaluator, one scene and one language
    instruction chosen by that evaluator, run on that evaluator's robot. Items are not
    stored in advance and are never repeated.
  source: src-roboarena-site-bundle
  quote: "instead of standardizing the set of tasks for which all policies are evaluated, we allow evaluators to pick"
  constraint:
    source: src-roboarena-site-bundle
    quote: "The only requirement is that evaluations are done pairwise, maintaining the same task and environment for the policies in the pair."
  blinding:
    source: src-roboarena-site-bundle
    quote: "Evaluations are double-blind and distributed across institutions."
  task_distribution_drifts: true
  task_distribution_drifts_quote: "The task distribution can evolve with policy capabilities."
  task_distribution_drifts_source: src-roboarena-site-bundle

feedback_per_item:
  # Three signals are collected; only one of them drives the leaderboard.
  signals:
    - kind: pairwise preference (binary, ties allowed)
      ranks: true
    - kind: progress score, 0-100 per policy
      ranks: false                    # studied in the paper as an alternative ranker, not the official one
    - kind: free-form language explanation
      ranks: false                    # used to generate qualitative policy reports
  source: src-roboarena-arxiv-html
  quote_note: The paper puts inline math ("∈ [0…100]") mid-sentence; the quote starts after it.
  quote: "that is proportional to the maximum progress a policy achieved on the task (e.g., 0 for no progress, 100 for successfully executing the task, intermediate values for partial success)"

# --- The metric: relative, pool-dependent, and not quite Elo -----------------------------------

metric:
  kind: relative-rating
  absolute_score: false
  model: Bradley-Terry with Davidson ties
  model_source: src-roboarena-site-bundle
  model_quote: "Bradley-Terry Davidson"
  paper_model_note: >
    The paper extends Bradley-Terry with latent task buckets fitted by EM, because the task
    changes between comparisons and a plain BT model assumes it does not. The site's chart
    is labelled "Elo score"; the fit is not an online Elo update. The rating scale is
    Elo-like (scores around 1,500-1,800) with a standard deviation per policy.
  paper_model_source: src-roboarena-arxiv-html
  paper_model_quote: "assumes that each pairwise comparison in the preference dataset takes place under identical conditions. This assumption is not satisfied in the setting of A/B robot policy evaluations"
  rating_pool_required: true          # a rating means nothing outside its pool and snapshot
  snapshot:
    last_updated: 2026-09-23T18:46:33Z
    source: src-roboarena-api-leaderboard
    quote: '"last_updated":"2026-09-23T18:46:33.415445Z"'
  official_threshold:
    value: 100
    unit: A/B evaluations per policy
    source: src-roboarena-site-bundle
    quote: "A/B evals per policy are required for the official leaderboard."
    value_locator: 'bundle constant `Bn=100`, used in the title string above'
  provisional_rows_on_same_board: true
  provisional_note: >
    The API's board mixes official and provisional rows. Its top row (j2-vla, 1788) has 25
    evaluations and is not official; the top official row (dreaming_zebra, shown as
    "DreamZero", 1735) has 190. An ingester that takes row 1 records the wrong leader.
  provisional_source: src-roboarena-site-bundle
  provisional_quote: "All policies · includes early results with higher uncertainty."
  ceiling_anchor_type: none-known     # correct, not a gap: a relative rating has no top
  headroom: null                      # forced by the rating being relative (02 S8 guard 4)

