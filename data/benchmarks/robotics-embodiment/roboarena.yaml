# --- Governance -------------------------------------------------------------------------------

governance:
  maintainer_type: community-collective
  maintainer_note: >
    The self-description is "community-run", and evaluation is distributed. But ranking,
    the backend, the safety screening and the evaluation budget are run centrally by the
    core team. The evaluator network is distributed; the maintainer is not.
  maintainer_type_source: src-roboarena-site-bundle
  submission_process: live-arena
  submission_process_note: >
    02 S12.2 says physical-competition, "at a venue on a date". Entrants never ship
    hardware or travel; they host a server. The CoRL 2025 challenge was a dated event
    run on the arena, recorded under `events`.
  admission:
    safety_screen: >
      New policy servers pass a format check and a supervised test run before joining the
      evaluation pool.
    source: src-roboarena-arxiv-html
    quote: "Only after a policy passed these tests, we add it to the general pool and distribute it to evaluators."
  evaluation_budget:
    source: src-roboarena-site-bundle
    quote: "You have a weekly budget of policy evaluations, and can get more by contributing evaluations yourself!"
    comparability_consequence: >
      A policy's sample size depends on its submitter's budget and contributions, which is
      why some rows have 6 evaluations and others 1,000.
  independence_flags: []
  independence_flags_note: >
    Empty, not `no-known-conflict`. 02 S12.2 sets maintainer-competes-on-own-benchmark,
    and no source read here establishes it: the paper's HTML carries no affiliations.
  known_limitation:
    source: src-roboarena-arxiv-html
    quote: "we have not investigated its robustness to intentionally adversarial evaluators"

# --- Execution: the cost depends on which role you play --------------------------------------

execution:
  compute_tier_by_role:
    submitter: null                   # hosting a policy server; GPU class not stated in any source
    evaluator: physical-hardware
  compute_tier: physical-hardware
  compute_tier_note: >
    A submitter needs no robot; that is the design's point. The tier describes the network,
    not the entrant.
  compute_tier_by_role_source: src-roboarena-arxiv-html
  compute_tier_by_role_quote: "DROID-RoboArena can enable researchers without access to a physical robot to train and evaluate real-world generalist robot policies"
  reproducibility_tier: requires-specialized-hardware
  reproducibility_blockers: [hardware-fleet, human-raters, live-world-state]
  reproducibility_tier_note: >
    Rescoring is possible: the evaluation records are open, so the rating can be refitted
    from the data dump. Rerunning is not: the items were improvised once, on hardware and
    by people outside anyone's control.
  harness_availability: reference-implementation-only
  harness_note: >
    The repository provides the policy-server interface, a client and simulated
    pre-submission checks. No harness can produce the official score, which exists only
    as the output of the live network.
  harness_source: src-roboarena-readme
  harness_quote: "(1) serving your policy via a remote policy server, to make it ready for RoboArena evaluation"
  code_licence: MIT
  code_licence_source: src-roboarena-gh-api

