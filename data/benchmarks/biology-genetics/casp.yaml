# data/benchmarks/biology-genetics/casp.yaml
#
# P0-S3-T02. Written from the primary sources below with NO schema in front of the author
# (14-roadmap "Start here", Week 2 item 4). Field names are invented where the entry needed
# them; P0-S5 reconciles them. `_schema_findings` at the bottom is the product of this task.
#
# The task says "from the CASP17 assessment papers". They do not exist yet. CASP17's
# prediction season closed in August 2026 and its results are due on the eve of the
# conference (30 Nov 2026). The assessment layer here is therefore CASP16's (Proteins,
# published 2025-26), and CASP17 contributes only what its own pages say about the round in
# progress. Re-read this entry against the CASP17 papers when they appear.
#
# Three premises in the plan did not survive the sources, and each is recorded where it bites:
#   1. "No leaderboard at all" (02 S12.1). The Prediction Center publishes z-score ranking
#      tables per category. The authoritative output is still the assessment papers, and
#      the two can rank differently.
#   2. "Human-expert groups ranked separately from automated servers." Servers are ranked
#      separately; human ("expert") groups are ranked with everyone, in the all-groups
#      table. The separate category is the server one.
#   3. "maintenance_status: unobservable ... has no signal our probes can read." CASP has a
#      dated target list, a dated message board and a dated download area.

id: casp
name: CASP
aliases:
  - Critical Assessment of Structure Prediction
  - Critical Assessment of Techniques for Protein Structure Prediction
tagline: Blind biennial prediction of unreleased experimental structures, scored by independent
  assessors.

description: >
  Every two years the Prediction Center releases sequences of proteins, nucleic acids and
  complexes whose experimental structures are about to be determined but are not public.
  Registered groups -- automated servers with a short deadline and human-led "expert" groups
  with a longer one -- submit models. As the structures are released, models are scored
  automatically, independent assessor teams evaluate each category, and the round closes
  with a conference and a special issue of Proteins.

# --- Taxonomy --------------------------------------------------------------------------------

domain:
  primary: biology-genetics/protein-structure-prediction
  secondary:
    - biology-genetics/nucleic-acid-structure
    - biology-genetics/protein-protein-interaction
    - biology-genetics/protein-ligand-cofolding
    - biology-genetics/drug-target-interaction   # the CASP16 affinity targets; not in 02 S12.1
  per_edition: true
  per_edition_note: >
    The secondary list is a union over recent editions. The category set changes every
    round (CASP17 adds immune complexes), so a single domain list is a lossy summary.

capability:
  - generation-fidelity
  - calibration-uncertainty
  - distribution-shift-generalization
capability_basis:
  generation-fidelity: >
    The score is a distance from a produced structure to the experimental one (GDT_TS,
    lDDT, DockQ), which is the term's inclusion test verbatim.
  calibration-uncertainty:
    reason: The scoring consumes a confidence emitted by the system, per residue.
    source: src-casp16-monomer
    quote: predictors are required to submit their own “pLDDT score” in the b‐factor column of their
      predicted structures
  distribution-shift-generalization:
    reason: CASP17 deliberately selects targets outside what current methods were fitted to, and the
      overview reports the degradation.
    source: src-casp17-home
    quote: Proteins and complexes with weak evolutionary information such as those with viral or
      parasite origin
capability_considered_and_rejected:
  # 02 S12.1 tags perception, abstraction, quantitative-reasoning and
  # distribution-shift-generalization. Only the last survives the P0-S2 inclusion tests.
  - term: perception
    reason: The input is a sequence, not "an image, video, audio stream, point cloud or comparable
      raw signal".
  - term: abstraction
    reason: Nothing in the protocol isolates finding a representation from producing coordinates;
      the tie-break says tag what the source claims, and no CASP source claims this.
  - term: quantitative-reasoning
    reason: The output is a structure, not a number reached by calculation; the OUT clause excludes
      numbers that are not the scored answer.
  - term: spatial-reasoning
    reason: OUT clause, verbatim -- "do NOT tag it where the scored quantity is reconstruction
      accuracy rather than a spatial inference".

evaluation_method:
  - domain-metric
  - expert-panel-assessment
evaluation_method_note: >
  expert-panel-assessment's own OUT clause says "do NOT tag it where a leaderboard is the
  published artifact". CASP publishes both, and the definition assumes one or the other.
  Tagged because the papers are the authoritative output; the term needs a both-case.

designed_for_subjects:
  - domain-specialist-model
  - human-ai-team
designed_for_subjects_basis: >
  Servers are automated, field-specific systems. "Expert" groups are people who run and
  steer those systems, which is human-ai-team by definition: a human and a system evaluated
  as one entrant.
designed_for_subjects_considered_and_rejected:
  - term: human-expert
    reason: >
      Its definition is "Credentialed humans evaluated on the same task as machine entrants".
      No CASP entrant is a human without a system. Its inclusion test also says "CASP ranks
      human-expert groups in a separate category from automated servers", and the ranking
      page shows the reverse: servers get the separate table.
  - term: scientific-surrogate-model
    reason: Its IN list is "a solver, potential or forecast system"; a structure predictor stands in
      for a measurement, which the term does not name. Near-miss.

# --- Lifecycle, saturation per category --------------------------------------------------------

lifecycle: active
activity: unknown                     # `assessment-in-progress` is not in the vocabulary: see tags[] and activity_note
activity_note: >
  Submissions are closed, the edition is not finished, and no next round is announced.
  `between-rounds` says the edition is over; `round-scheduled` says one has not opened;
  `closed` says the benchmark accepts nothing ever again. None is true today.

# --- Admissibility (04 S5; 00 S6 A5) -- added by P0-S4-T03 with the user's approval ---------
# The learned-entrant test: in scope because at least one entrant is a learned system, and
# the entry cites where that is shown. Quoted from a source this entry already relied on.

learned_entrant_evidence:
  - system: AlphaFold-Multimer and AlphaFold3, as the core modelling engine of most CASP16 groups
    source: src-casp16-complex
    observed_on: 2026-09-23
    quote: Most CASP16 groups relied on AlphaFold‐Multimer (AFM) or AlphaFold3 (AF3) as their core
      modeling engines.
    note: >
      The entrants are research groups; this is the organisers saying what most of them ran.
      AlphaFold 3 as an assessor-run baseline (results_observed) is not an entrant and is not
      the evidence.
evaluation_target: learned-system
entrant_classes:
  # The field the plan predicted, but not the shape it predicted.
  - class: server
    deadline: server expiration (about 3 days after release on the CASP16 list)
    deadline_source: src-casp16-targets
    deadline_quote: Entry Date Server Expiration Ligand Deadline Human Expiration
    ranked_separately: true
    source: src-casp16-zscores
    quote: Server groups on 'all groups' + 'server only' targets
  - class: expert
    deadline: human expiration (about 2 weeks after release)
    ranked_separately: false          # ranked in the all-groups table, with servers
    source: src-casp16-monomer
    quote: 125 human expert groups and 36 server groups submitted predictions for 16, 42, and 27
      targets from Phase 0, 1, and 2, respectively.
entrant_classes_history:
  source: src-casp16-overview
  quote: It is noteworthy that a server delivers the best performance—for much of the history of
    CASP, methods with human input performed better than servers.

# --- Data ------------------------------------------------------------------------------------

data:
  access: fully-open                  # after the edition; see access_by_phase
  access_by_phase:
    during_edition: sequences public, structures not yet released; submission needs a Prediction
      Center account
    after_edition: targets, predictions and results in an open directory listing
    after_edition_source: src-casp16-download
    after_edition_quote: Index of /download_area/CASP16
    note: >
      No single access value is true for the whole life of an edition. `fully-open` is the
      value for every completed edition, which is what a catalogue reader downloads.
      During an edition the closest term is `private-test-server`, and even that is loose:
      the structures are often not yet solved, let alone held by the maintainer.
  refresh: periodic-recompetition
  data_provenance:
    - experimental-measurement
  data_provenance_note: X-ray, cryo-EM and NMR structures, contributed by experimental groups before
    publication.
  contamination_risk: low
  contamination_risk_caveat: >
    Homologous structures in the PDB are legitimate inputs, not contamination, and they are
    exactly what the "weak evolutionary information" targets remove.
  contamination_risk_basis: >
    Targets are chosen because their structures are not yet public, and the organisers
    cancel targets that leak. CASP17's target list shows one cancelled because of a
    preprint and one because another group released the structure.
  contamination_risk_source: src-casp17-targets
  contamination_risk_quote: Canceled - preprint.
  ceiling_anchor_type: noise-ceiling
  ceiling_anchor_type_note: >
    02 S12.1 says expert-best. The sources say the ceiling is the experiment's own
    uncertainty, and for affinity they give it a number. The anchor is per category, not
    per benchmark.
  ceiling_by_category:
    - category: monomers
      source: src-casp16-overview
      quote: for most proteins, agreement is likely as high as can be obtained given experimental
        uncertainty.
    - category: ligand affinity
      value: 0.73
      metric: Kendall's tau
      source: src-casp16-ligand
      quote: well below the theoretical maximum possible given experimental uncertainty (~0.73)

# --- Governance -------------------------------------------------------------------------------

governance:
  maintainer: Protein Structure Prediction Center (UC Davis) with a CASP organising committee
  maintainer_note: >
    The committee spans five institutions in three countries, so academic-lab understates
    it; but it is not a legally constituted consortium, and it does not re-form per
    edition, so neither alternative fits better.
  maintainer_type: academic-lab
  submission_process: assessment-committee
  submission_process_note: >
    The term's definition begins "There is no leaderboard". CASP has ranking tables; the
    rest of the definition (a peer-reviewed assessment by a committee) is right.
  independence_flags: []
  independence_flags_note: >
    Deliberately empty, not `no-known-conflict`, because the search found one thing a
    reviewer should rule on (below) and no term that fits it.
  funding:
    source: src-casp17-home
    quote: The CASP17 Experiment and the Protein Structure Prediction Center are funded by the NIH,
      National Institute of General Medical Sciences
  participation:
    source: src-casp17-home
    quote: Participation is open to all.
  independence_policy:
    source: src-casp17-home
    quote: In accordance with CASP policy, assessors cannot take part in the relevant parts of the
      experiment as predictors.
# --- Execution --------------------------------------------------------------------------------

execution:
  compute_tier: null                  # no source states what a participant's run costs; not guessed
  reproducibility_tier: null
  reproducibility_tier_note: >
    Two different questions with two different answers. Re-scoring archived CASP16 models
    against released structures is fully automatable from the open download area.
    Re-running the benchmark -- a blind prediction against unreleased structures -- is
    possible only inside a live edition, for anyone, and never afterwards. No tier term
    distinguishes these.
  reproducibility_blockers:
    - live-world-state
  reproducibility_blockers_note: >
    02 S12.1 gives [unreleasable-data, wet-lab]. The data is released (see
    access_by_phase), and reproducing a score needs the deposited structure, not a new
    experiment. What cannot be reproduced is blindness, and live-world-state ("the same run
    cannot be repeated against the same conditions") is the nearest term.
  harness_availability: null
  harness_note: >
    The Prediction Center scores submissions and publishes the results; whether its
    evaluation code is published as a harness was not checked. Not guessed.
  submission_channel:
    source: src-casp17-home
    quote: New in CASP17 - we will be accepting submissions only through the web form or server API.

homepage: https://predictioncenter.org/
maintainer_url: https://predictioncenter.org/casp17/index.cgi

metrics:
  # Each is a separate Metric ref in 04; which one ranks depends on the category AND the
  # edition's assessors, who may add their own.
  assessor_discretion:
    source: src-casp17-home
    quote: Assessment criteria will be based on those previously developed in CASP, but assessors
      may add new metrics they consider appropriate.
  prediction_center_ranking:
    metric: GDT_TS z-score (monomers)
    source: src-casp16-zscores
    quote: The ranking of groups is based on the analysis of zscores for GDT_TS .
  assessor_ranking_monomers:
    metric: weighted sum of z-scores over nine measures
    measures:
      - GDT_HA
      - QSE
      - reLLG_const
      - SphGr
      - CAD_AA
      - GDC_SC
      - AL0_P
      - lDDT
      - MolProbity
    source: src-casp16-monomer
    quote: 'nine representative measures were selected: GDT_HA, QSE, reLLG_const, SphGr, CAD_AA, GDC_SC,
      AL0_P'
    note: >
      Not the same formula as the Prediction Center table above, which ranks on GDT_TS
      alone. Two official rankings of one category exist and can disagree.
  complexes:
    - DockQ
    - ICS
  complexes_source: src-casp16-complex
  complexes_quote: Target Stoichiometry Taxonomy Technique DockQ95 ICS95 Category
  ligands:
    - LDDT-PLI
    - Kendall's tau (affinity)
  ligands_source: src-casp16-ligand
  ligands_quote: AlphaFold 3 did particularly well, with a mean LDDT‐PLI of 0.8, thus outscoring the
    best CASP16 predictor.
  review_note: >
    Whether GDT_TS, lDDT and DockQ are the right headline metrics per category is a
    structural-biology judgement. The task marks it for a human.

tags:
  - assessment-in-progress

