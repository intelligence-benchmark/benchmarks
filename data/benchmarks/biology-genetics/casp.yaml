# --- Editions, not versions ------------------------------------------------------------------
# A claim is about an edition. Editions are not versions of one dataset: each has a fresh
# target set, a partly new category list, and its own assessors, so a CASP15 number and a
# CASP16 number are not on the same test set even within one category.

editions:
  cadence:
    value: biennial
    source: src-casp17-home
    quote: Every two years, participants are invited to submit models for a set of macromolecules
      and their complexes (proteins, RNA, ligands) for which the experimental structures are not yet
      public.
  first_edition: null                 # CASP1's year is not in any source read here; not guessed
  current: casp17
  list:
    - id: casp16
      year: 2024
      status: complete
      targets_assessed:
        value: 101
        unit: experimental targets
        source: src-casp16-overview
        quote: Results were assessed for a total of 101 experimental targets provided by 56 groups
          from 15 countries.
      targets_released:
        # Released and assessed are different counts, and 300 "targets" are 101 structures
        # split into evaluation units, phases and ligand poses. Recorded, not reconciled.
        value: 300
        source: src-casp16-home
        quote: yielding 300 targets in five prediction categories
      participation:
        sources_disagree: true        # four figures from the organisers for one round
        values:
          - claim: nearly 100 groups, more than 80,000 models
            source: src-casp16-home
            quote: nearly 100 research groups from around the world submitted more than 80,000
              models on 100+ modeling entities yielding 300 targets in five prediction categories.
          - claim: over 100 groups, more than 120,000 models, 150+ targets
            source: src-casp17-home
            quote: In the latest CASP round, CASP16 in 2024, over 100 research groups from around
              the world submitted more than 120,000 models on 150+ targets in five broad prediction
              categories.
          - claim: 110 groups, 200 methods, over 128,000 submissions
            source: src-casp16-overview
            quote: A total of 110 research groups from 22 countries used a total of 200 methods to
              address a range of computational structural biology areas. In all, over 128,000
              submissions were received.
          - claim: 210 registered groups, 162 expert and 48 servers
            source: src-casp16-numbers
            quote: 'Number of groups registered 210 including: expert groups 162 prediction servers 48'
          - claim: 128,161 total submissions (last column of the all-categories row)
            source: src-casp16-numbers
            quote: 'All (unique): 200 / 48 29987 128161'
        preferred: src-casp16-overview  # the peer-reviewed overview; the others are web copy
      categories:
        - single proteins and domains
        - protein complexes
        - accuracy estimation
        - nucleic acid structures and complexes
        - protein-organic ligand complexes
        - macromolecular ensembles
      categories_source: src-casp16-home
      proceedings: Proteins special issue (CASP16), 2025-2026
      site_error_noted:
        source: src-casp16-home
        quote: CASP16 results will be published in a special edition of Proteins in 2023.
        note: A 2024 round cannot publish in 2023. Shown so nobody copies the date.
    - id: casp17
      year: 2026
      status: assessment-in-progress
      prediction_season:
        sources_disagree: true        # the same page gives two end dates
        values:
          - value: 2026-09-11
            source: src-casp17-home
            quote: CASP17 prediction season is over as of September 11, 2026.
          - value: 2026-08-19
            source: src-casp17-home
            quote: CASP17 prediction season is over as of Aug 19, 2026.
      results_due:
        value: 2026-11-29             # "one day before" the conference start below
        source: src-casp17-home
        quote: The assessment results will be available through this website one day before the
          start of the CASP17 conference on November 30, 2026.
        conflicts_with:
          source: src-casp17-home
          quote: The conference to discuss results of the CASP17 experiment will be held in December
            2026.
      participation:
        value: 245
        unit: groups with predictions (178 expert, 67 servers)
        source: src-casp17-numbers
        quote: 'Number of groups with predictions 245 including: expert groups 178 prediction servers
          67'
        caveat: >
          Several other rows of the CASP17 numbers page (pharma ligand pose 233, affinity
          140, stage 2 110) are identical to CASP16's page and look carried over. Only the
          group counts are used.
      categories_new:
        - immune complexes
      categories_new_source: src-casp17-home
      categories_new_quote: we are introducing immune complexes as a specific category in CASP17
      server_only_targets: true       # new: some targets are released to servers only
      server_only_source: src-casp17-targets
      server_only_quote: Target type 'h' is for human targets, 's' for server-only targets.
      assessors_named: true
      assessors_source: src-casp17-home
saturation_by_category:
  # Why a single lifecycle value for CASP is wrong. Evidence only; `saturated` is derived.
  - category: single-domain fold prediction
    state: near-solved
