  [2602.15922] World Action Models are Zero-shot Policies Skip to main content Search Submit Donate Log in Search arXiv Press Enter to search · Advanced search --> Computer Science > Robotics arXiv:2602.15922 (cs) [Submitted on 17 Feb 2026] Title: World Action Models are Zero-shot Policies Authors: Seonghyeon Ye , Yunhao Ge , Kaiyuan Zheng , Shenyuan Gao , Sihyun Yu , George Kurian , Suneel Indupuru , You Liang Tan , Chuning Zhu , Jiannan Xiang , Ayaan Malik , Kyungmin Lee , William Liang , Nadun Ranawaka , Jiasheng Gu , Yinzhen Xu , Guanzhi Wang , Fengyuan Hu , Avnish Narayan , Johan Bjorck , Jing Wang , Gwanghyun Kim , Dantong Niu , Ruijie Zheng , Yuqi Xie , Jimmy Wu , Qi Wang , Ryan Julian , Danfei Xu , Yilun Du , Yevgen Chebotar , Scott Reed , Jan Kautz , Yuke Zhu , Linxi "Jim" Fan , Joel Jang View a PDF of the paper titled World Action Models are Zero-shot Policies, by Seonghyeon Ye and 35 other authors View PDF HTML (experimental) Abstract: State-of-the-art Vision-Language-Action (VLA) models excel at semantic generalization but struggle to generalize to unseen physical motions in novel environments. We introduce DreamZero, a World Action Model (WAM) built upon a pretrained video diffusion backbone. Unlike VLAs, WAMs learn physical dynamics by predicting future world states and actions, using video as a dense representation of how the world evolves. By jointly modeling video and action, DreamZero learns diverse skills effectively from heterogeneous robot data without relying on repetitive demonstrations. This results in over 2x improvement in generalization to new tasks and environments compared to state-of-the-art VLAs in real robot experiments. Crucially, through model and system optimizations, we enable a 14B autoregressive video diffusion model to perform real-time closed-loop control at 7Hz. Finally, we demonstrate two forms of cross-embodiment transfer: video-only demonstrations from other robots or humans yield a relative improvement of over 42% on unseen task performance with just 10-20 minutes of data. More surprisingly, DreamZero enables few-shot embodiment adaptation, transferring to a new embodiment with only 30 minutes of play data while retaining zero-shot generalization. Comments: Project page: this https URL Subjects: Robotics (cs.RO) ; Computer Vision and Pattern Recognition (cs.CV); Machine Learning (cs.LG) Cite as: arXiv:2602.15922 [cs.RO] (or arXiv:2602.15922v1 [cs.RO] for this version) https://doi.org/10.48550/arXiv.2602.15922 Focus to learn more arXiv-issued DOI via DataCite Submission history From: Seonghyeon Ye [ view email ] [v1] Tue, 17 Feb 2026 15:04:02 UTC (11,817 KB) Full-text links: Access Paper: View a PDF of the paper titled World Action Models are Zero-shot Policies, by Seonghyeon Ye and 35 other authors View PDF HTML (experimental) TeX Source view license Current browse context: cs.RO < prev | next > new | recent | 2026-02 Change to browse by: cs cs.CV cs.LG References & Citations NASA ADS Google Scholar Semantic Scholar export BibTeX citation Loading... BibTeX formatted citation × loading... Data provided by: Bookmark Bibliographic Tools Bibliographic and Citation Tools Bibliographic Explorer Toggle Bibliographic Explorer ( What is the Explorer? ) Connected Papers Toggle Connected Papers ( What is Connected Papers? ) Litmaps Toggle Litmaps ( What is Litmaps? ) scite.ai Toggle scite Smart Citations ( What are Smart Citations? ) Code, Data, Media Code, Data and Media Associated with this Article alphaXiv Toggle alphaXiv ( What is alphaXiv? ) Links to Code Toggle CatalyzeX Code Finder for Papers ( What is CatalyzeX? ) DagsHub Toggle DagsHub ( What is DagsHub? ) GotitPub Toggle Gotit.pub ( What is GotitPub? ) Huggingface Toggle Hugging Face ( What is Huggingface? ) ScienceCast Toggle ScienceCast ( What is ScienceCast? ) Demos Demos Replicate Toggle Replicate ( What is Replicate? ) Spaces Toggle Hugging Face Spaces ( What is Spaces? ) Spaces Toggle TXYZ.AI ( What is TXYZ.AI? ) Related Papers