  [2506.18123] RoboArena: Distributed Real-World Evaluation of Generalist Robot Policies Skip to main content Search Submit Donate Log in Search arXiv Press Enter to search · Advanced search --> Computer Science > Robotics arXiv:2506.18123 (cs) [Submitted on 22 Jun 2025 ( v1 ), last revised 29 Nov 2025 (this version, v2)] Title: RoboArena: Distributed Real-World Evaluation of Generalist Robot Policies Authors: Pranav Atreya , Karl Pertsch , Tony Lee , Moo Jin Kim , Arhan Jain , Artur Kuramshin , Clemens Eppner , Cyrus Neary , Edward Hu , Fabio Ramos , Jonathan Tremblay , Kanav Arora , Kirsty Ellis , Luca Macesanu , Marcel Torne Villasevil , Matthew Leonard , Meedeum Cho , Ozgur Aslan , Shivin Dass , Jie Wang , William Reger , Xingfang Yuan , Xuning Yang , Abhishek Gupta , Dinesh Jayaraman , Glen Berseth , Kostas Daniilidis , Roberto Martin-Martin , Youngwoon Lee , Percy Liang , Chelsea Finn , Sergey Levine View a PDF of the paper titled RoboArena: Distributed Real-World Evaluation of Generalist Robot Policies, by Pranav Atreya and 31 other authors View PDF HTML (experimental) Abstract: Comprehensive, unbiased, and comparable evaluation of modern generalist policies is uniquely challenging: existing approaches for robot benchmarking typically rely on heavy standardization, either by specifying fixed evaluation tasks and environments, or by hosting centralized ''robot challenges'', and do not readily scale to evaluating generalist policies across a broad range of tasks and environments. In this work, we propose RoboArena, a new approach for scalable evaluation of generalist robot policies in the real world. Instead of standardizing evaluations around fixed tasks, environments, or locations, we propose to crowd-source evaluations across a distributed network of evaluators. Importantly, evaluators can freely choose the tasks and environments they evaluate on, enabling easy scaling of diversity, but they are required to perform double-blind evaluations over pairs of policies. Then, by aggregating preference feedback from pairwise comparisons across diverse tasks and environments, we can derive a ranking of policies. We instantiate our approach across a network of evaluators at seven academic institutions using the DROID robot platform. Through more than 600 pairwise real-robot evaluation episodes across seven generalist policies, we demonstrate that our crowd-sourced approach can more accurately rank the performance of existing generalist policies than conventional, centralized evaluation approaches, while being more scalable, resilient, and trustworthy. We open our evaluation network to the community and hope that it can enable more accessible comparisons of generalist robot policies. Comments: Website: this https URL Subjects: Robotics (cs.RO) ; Machine Learning (cs.LG) Cite as: arXiv:2506.18123 [cs.RO] (or arXiv:2506.18123v2 [cs.RO] for this version) https://doi.org/10.48550/arXiv.2506.18123 Focus to learn more arXiv-issued DOI via DataCite Submission history From: Karl Pertsch [ view email ] [v1] Sun, 22 Jun 2025 18:13:31 UTC (9,691 KB) [v2] Sat, 29 Nov 2025 22:53:38 UTC (10,951 KB) Full-text links: Access Paper: View a PDF of the paper titled RoboArena: Distributed Real-World Evaluation of Generalist Robot Policies, by Pranav Atreya and 31 other authors View PDF HTML (experimental) TeX Source view license Current browse context: cs.RO < prev | next > new | recent | 2025-06 Change to browse by: cs cs.LG References & Citations NASA ADS Google Scholar Semantic Scholar export BibTeX citation Loading... BibTeX formatted citation × loading... Data provided by: Bookmark Bibliographic Tools Bibliographic and Citation Tools Bibliographic Explorer Toggle Bibliographic Explorer ( What is the Explorer? ) Connected Papers Toggle Connected Papers ( What is Connected Papers? ) Litmaps Toggle Litmaps ( What is Litmaps? ) scite.ai Toggle scite Smart Citations ( What are Smart Citations? ) Code, Data, Media Code, Data and Media Associated with 