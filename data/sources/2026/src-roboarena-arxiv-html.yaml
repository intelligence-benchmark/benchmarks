  ng qualitative policy characteristics via LLM-assisted analysis of evaluation results. We then instantiate RoboArena on the DROID robot platform [ 1 ] , on which modern policies can out-of-the-box generalize to new scenes and tasks [ 5 ] . Through decentralized evaluations of 7 generalist policies across 7 universities and a total of 612 pairwise comparisons, we demonstrate that RoboArena provides more accurate performance rankings of generalist policies than the conventional, centralized evaluation scheme used in prior work, when compared to an “oracle” policy ranking computed via exhaustive  [...] evaluations are complete, E E provides feedback F ⁡ ( π A , π B ) F(\pi_{A},\pi_{B}) about the performance of the policies. We ask evaluators to provide three types of feedback: a continuous progress score ∈ [ 0 ​ … ​ 100 ] \in[0\dots 100] that is proportional to the maximum progress a policy achieved on the task (e.g., 0 for no progress, 100 for successfully executing the task, intermediate values for partial success); a binary, pairwise preference label that indicates which policy the evaluator preferred (we leave it to the evaluator to decide how to determine their policy preference); and a free-form, natural language explanation for why they preferre [...] pairwise preferences 𝒟 p = { P π A , π B , t } \mathcal{D}_{p}=\{P_{\pi_{A},\pi_{B}},t\} , where P π A , π B ∈ { 0 , 1 } P_{\pi_{A},\pi_{B}}\in\{0,1\} indicates a binary preference, and t t identifies the task the A/B evaluation was run on (e.g., a specific scene and language instruction). We aim to compute a global policy ranking ℛ : π i > π j > ⋯ > π k \mathcal{R}:\pi_{i}>\pi_{j}>\dots>\pi_{k} . Bradley-Terry Model The Bradley-Terry (BT) model [ 60 ] is commonly used in a learning from preferences setting. BT models the w [...] eed to converge to the maximum likelihood fit of the data [ 62 ] . This iterative algorithm can also be modified to support ties [ 63 ] . Extending BT The Bradley-Terry model, while appealing due to the existence of stable offline solvers, assumes that each pairwise comparison in the preference dataset takes place under identical conditions. This assumption is not satisfied in the setting of A/B robot policy evaluations, where the task under which the A/B evaluation is conducted can vary from one evaluation to the next. Importantly, the task can significantly affect the policy preference: for example, a task that is very difficult or very easy for both po [...] rimentally verify our tool in Section 5.4 , and include example policy reports in the supplementary data. 4 The DROID-RoboArena Evaluation System We instantiate RoboArena in a prototype evaluation system on the DROID robot platform [ 1 ] , which consists of a Franka Panda 7DoF robot arm, a Robotiq 2F-85 parallel-jaw gripper, a ZED-mini stereo wrist camera and one or multiple external ZED 2 stereo cameras (see Figure 3 ). We choose the DROID platform since it offers multiple attractive properties: • The Panda arm provides sufficient dexterity to perform a wide range of manipulation tasks across varied real-world environments. • The robot is [...] 4.2 Open-Sourcing RoboArena: Interfaces, Safety and Incentives Our goal in designing the DROID-RoboArena is to provide it as a resource to the robotics community, to which anyone can submit policies and contribute evaluations. Importantly, DROID-RoboArena can enable researchers without access to a physical robot to train and evaluate real-world generalist robot policies – now all required resources are open-source: diverse, real-robot datasets [ 50 , 2 , 1 , 54 ] , scalable modeling frameworks [ 39 , 3 , 64 , 65 , 47 ] , and DROID-RoboArena real-robot evaluations. Making the DROID-RoboArena easy to use, safe, and self-sustaining requires a few additional elements. First, we make it easy to browse all performed evaluations and view existing policy leaderboards on our website. We plan to publish separate leaderboards for “all policies” and “open-source policies”; the latter are trained only on publicly available datasets, and provide weight access and details for how to reproduce training. Additionally, we design multiple safety layers to prevent policies from damaging robot evaluation hardware: f [...] ronment” across a few different scenes and tasks with a specifically trained evaluator that is able to quickly intervene if a policy runs the danger of acting unsafely and damaging the robot (akin to a test driver for autonomous vehicles). Only after a policy passed these tests, we add it to the general pool and distribute it to evaluators. Finally, to make the DROID-RoboArena self-sufficient in the long term, we implement an “evaluation credit” system , that balances evaluation supply and demand: for every pairwise policy evaluation that an evaluator runs, they receive a cre [...]  other researchers access for contributing policies and evaluations, in an effort to make evaluations of generalist robot policies more comparable. 7 Limitations Cross-embodiment. While RoboArena is a general approach for robot evaluation, the experimental evaluations in this paper have focused on the DROID platform [ 1 ] , since it was well-suited for developing our evaluation framework. However, there is a growing interest in developing cross-embodiment policies, that can not only operate across many scenes and tasks, but also across robot embodimen [...] geted, smaller-scale evaluations that focus on individual axes of generalization [ 72 ] . Adversarial evaluators. While RoboArena’s distributed, double-blind evaluation scheme gives it an inherent robustness against individual influencing, we have not investigated its robustness to intentionally adversarial evaluators that try to temper with evaluation results, for example by providing random preference ratings or intentionally misleading language feedback. Future work should investigate how distributed robot evaluation approaches can be hardened agains
