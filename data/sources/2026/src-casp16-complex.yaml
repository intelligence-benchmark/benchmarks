  oRxiv 10.1101/2025.05.29.656875 PMC12154902 40501681 ABSTRACT The assessment of oligomer targets in the Critical Assessment of Structure Prediction Round 16 (CASP16) suggests that complex structure prediction remains an unsolved challenge. Even the leading groups can only predict slightly more than half of the targets to high accuracy. Most CASP16 groups relied on AlphaFold‐Multimer (AFM) or AlphaFold3 (AF3) as their core modeling engines. By optimizing input MSAs, refining modeling constructs (using partial rather than full sequences), and employing massive model sampli [...]  by the release of AF3 and the extensive model sampling employed by top groups. Several notable trends highlight frontiers for future development. First, the kozakovvajda group significantly outperformed others on antibody–antigen targets, achieving over a 60% success rate without relying on AFM or AF3 as their primary modeling framework, suggesting that alternative approaches may offer promising solutions for these difficult targets. Second, model ranking and selection continue to be major bottlenecks. The  [...] oscopy (cryo‐EM), and the rest were solved by X‐ray crystallography. Seventy‐seven point five percent (31/40) of these CASP16 oligomer targets (labeled by * in Table 1 ) were also used in CAPRI. TABLE 1 Overview of CASP16 oligomer targets. Target Stoichiometry Taxonomy Technique DockQ95 ICS95 Category Phase 0 Phase 2 H1202* A2B2 Human X‐ray 0.86 0.84 Heteromer No Yes H1204* A2B2C2 Nanobody–human X‐ray 0.2 0.11 Heteromer (NA) No Yes H1208* A1B1 Bacteria X‐ray 0.85 0.87 Heteromer Yes Yes H1213* A1B1C1D1E1 Virus EM 0.79 0.79 Heteromer No Y
