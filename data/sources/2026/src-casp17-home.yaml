quote_extract: |-
  Home - CASP17 17th Community Wide Experiment on the Critical Assessment of Techniques for Protein Structure Prediction --> Menu CASP17 The CASP17 Experiment and the Protein Structure Prediction Center are funded by the NIH, National Institute of General Medical Sciences CASP17 prediction season is over as of September 11, 2026. The assessors are currently working on the assessment of submitted models. The assessment results will be available through this website one day before the start of the CASP17 conference on November 30, 2026. CASP17 provides an independent mechanism for the assessment of methods of protein structure modeling. From May through August 2026, structures about to be solved by crystallography, cryo-EM or NMR are identified, and their sequences are ma [...] evaluated. Independent assessors bring objectivity, balance, and independent insight to this process. Tools for viewing, comparison, and analysis of submitted models are made available at this site. Targets Predictions Abstracts Conference CASP17 prediction season is over as of Aug 19, 2026. Target List Model Viewer Model Tarballs Abstract submission Deadline: September 25, 2026. Deadline: September 15. Time for submitting methods abstracts has expired. Abstract book will be available here in mid-November. --> Register for CAS [...] aranteed. CASP17 in numbers Call for targets Description of the experiment CASP (Critical Assessment of Structure Prediction) is a community wide experiment to determine and advance the state of the art in computational structural biology. Every two years, participants are invited to submit models for a set of macromolecules and their complexes (proteins, RNA, ligands) for which the experimental structures are not yet public. In the latest CASP round, CASP16 in 2024, over 100 research groups from around the world submitted more than 120,000 models on 150+ targets in five broad prediction categories. Independent assessors then compare the models with experiment. Assessments and results are posted at this website and published in a special issue of a scientific journal (lately PROTEINS - (check the latest CASP16 issue here) . Goals Cate [...] es Immune Complexes: This is an area of major practical importance, and also one that in CASP is a major failure area for current deep learning methods. However, two promising approaches have been seen in recent CASPs. To nurture progress, we are introducing immune complexes as a specific category in CASP17, aiming to provide a rich and varied set of non-homologous targets spanning antibody-antigen, nanobody-antigen complexes, and T-cell receptor complexes. Organic Ligand-Protein Complexes: These complexes have obvious importance for the deve [...]  cases, current deep learning methods deliver high-accuracy structures for single proteins and complexes. But there are critical weaknesses. To help address these, CASP17 will focus on performance in the following areas: Membrane proteins. Proteins and complexes with weak evolutionary information such as those with viral or parasite origin, "shallow" sequence alignments and recently evolved interfaces. Large proteins and complexes with complicated stoichiometry or arrangement of subunits (>1,000 amino acids). For protein complexes we will again work in close collaboration wi [...] id structures and complexes, and for protein-ligand complexes. Timetable March 31, 2026 - Start of the registration for CASP17 prediction experiment. April 13 - Start of the testing of server connectivity ("dry run" for server predictors). New in CASP17 - we will be accepting submissions only through the web form or server API. No email submissions. April 27 - May 1 - First week of releasing CASP17 targets. June/July - Early bird registration for the December CASP17 conference. July 31 - Last date for releasing targets. August 31 - End of the modeling season. Ear [...] groups with the most accurate models and the most interesting methods to give talks at the CASP17 conference. Second part of November - Program of the conference finalized. December 2026 - CASP17 Conference. Details to follow. Registration Participation is open to all. If you are new to CASP and don't have an account with the Prediction Center, you will have to register with the Prediction Center first and only then proceed to CASP17 registration. CASP17 registration page, which will be available here on [...] d Format page as submission procedures have changed for servers and those who used email gateways in previous CASPs. Assessment of models As is the practice in CASP, assessment of the results will be made by the independent assessor teams. Assessment criteria will be based on those previously developed in CASP, but assessors may add new metrics they consider appropriate. Where possible, results will also be evaluated using criteria from the previous CASP, so the effects of any changes in criteria can be appreciated. The CASP17 Assessors are as follows: Immune complexes - Dawid Zyla (University of Colorado  [...] ce) Ensembles - a multiinstitutional team led by Gaetano Montelione (Rensselaer Polytechnic Institute, Troy, NY, USA) Model accuracy estimation for MassiveFold models - TBA --> Click here for the list of assessors in all CASPs held so far. In accordance with CASP policy, assessors cannot take part in the relevant parts of the experiment as predictors. Participants must not contact assessors directly with queries, but rather these should be sent to the email address. Results and publication All CASP predictions and results of numerical evaluation will be made available through this web s [...] xperiments ). All participants are required to describe their methods in the abstracts, which will be published at our web site in late October. No talks at the conference will be offered to modelers without submitted abstracts. Conference The conference to discuss results of the CASP17 experiment will be held in December 2026. Details to follow. Registration for the conference will open in early June. Organizing committee John Moult, CASP chair and founder; IBBR, University of Maryland, USA Krzysztof Fidelis, founder, University of California, Davis, USA Andriy  [...] ul University, South Korea David Baker, University of Washington, USA Charlotte Dean, University of Oxford, UK Nick Grishin, University of Texas, USA Andrzej Joachimiak, Argonne National Lab, USA David Jones, University College, London, UK John Jumper, Google Deepmind, London, UK Funding Message Board Abstracts time! Dear CASP17 Participants, Submissions are now open for your CASP17 extended abstracts. Please note that your participation in CASP17 will only be formally recognized upon receipt of your abstract(s ...
