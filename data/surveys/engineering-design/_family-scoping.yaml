# data/surveys/engineering-design/_family-scoping.yaml
#
# P0-S10-T03, part 1: the Phase-0 scoping survey that 02 S3 makes a precondition of curating
# engineering-design at all. The recon named four candidates and never surveyed the family;
# this is the survey.
#
# Status: agent-drafted. A person must accept the finding (02 S3 floor rule) before it
# changes anything. Every family below was fetched on 2026-09-23 by a survey agent; the
# `evidence` lines are what that agent reported seeing. Entries marked `spot_checked: true`
# were re-fetched independently while writing this file. Quotes are deliberately NOT
# carried: one spot-check found a paraphrase presented as a quote, so none is trusted
# verbatim until re-read. Citation counts are Semantic Scholar and star counts GitHub, both
# on 2026-09-23, and several citation runs were rate-limited (see `unverified`).
#
# Counting convention: 02 S11 -- a benchmark and its versions/tracks are ONE family.

survey:
  family: engineering-design
  conducted_on: 2026-09-23
  method: >
    Six subdomain sweeps (arXiv abstract pages and search, GitHub API, official contest and
    project sites, Epoch AI's benchmark hub), then a three-part credibility test per
    candidate: (a) a primary source fetched that day; (b) a defined scoring procedure, not
    only a dataset or a method paper; (c) evidence of field-defining use -- a recurring
    contest, a leaderboard, a major venue, 100+ citations, or maintainer or industry
    backing.
  evidence_grades:
    S: recurring contest, 100+ citations, or major maintainer/industry adoption
    M: meets the bar through a major venue, a leaderboard or institutional backing
    W: meets the letter of the bar only
  drafted_by: agent (P0-S10-T03)
  accepted_by: null                     # a person, per the task's agent-draft executor

finding:
  credible_tier1_strict: 25
  credible_tier1_excluding_weak: 22     # drops CadEval [W], Tennessee Eastman (criterion b), LAB-Bench (biology-primary)
  floor: 12
  meets_floor: true
  coverage_status: surveyed             # unchanged: 22 >= 12, so the family is NOT muted
  note: >
    The planning risk in 02 S3 footnote section-sign was that fewer than twelve would be
    found. The opposite happened, but the spread is very uneven: circuit-eda is dense,
    experimental-apparatus-design has exactly one family. Two of the four candidates the
    recon named are not engineering-design benchmarks at all (see considered_not_tier1).

counts_by_subdomain:
  - subdomain: engineering-design/circuit-eda
    strict: 8
    excluding_weak: 8
  - subdomain: engineering-design/cad-geometry-generation
    strict: 4
    excluding_weak: 3
  - subdomain: engineering-design/structural-mechanical-design
    strict: 5
    excluding_weak: 5
  - subdomain: engineering-design/process-control-optimization
    strict: 3
    excluding_weak: 2
    with_scope_ambiguous: 6-7           # if energy-grid and robotics control are admitted
  - subdomain: engineering-design/experimental-apparatus-design
    strict: 1
    excluding_weak: 1
  - subdomain: engineering-design/lab-automation-execution
    strict: 4
    excluding_weak: 3

families:
  # --- circuit-eda ---------------------------------------------------------------------------
  - name: CAD Contest at ICCAD
    subdomain: circuit-eda
    grade: S
    first_release: 2012
    measures: Annual multi-problem EDA research contest on industry-supplied problems, ranked on hidden benchmarks.
    urls: ["https://www.iccad-contest.org/", "https://www.iccad-contest.org/History.html"]
    evidence: History page lists contests every year 2012-2025, three problems each; 2026 problems sponsored by Cadence, Synopsys and Intel.
    spot_checked: true                  # History page 200; years 2012..2026 present
  - name: ISPD Contest
    subdomain: circuit-eda
    grade: S
    first_release: 2005
    measures: Annual physical-design contest (placement, routing, sizing, clock networks), scored on public and hidden benchmark cases.
    urls: ["https://ispd.cc/ispd2026/index.php?page=contests", "https://www.ispd.cc/contests/26/index.html"]
    evidence: Editions listed from ISPD 2005 (placement) to ISPD 2026 (post-placement buffering and sizing), with named winners.
  - name: EPFL Combinational Benchmark Suite
    subdomain: circuit-eda
    grade: S
    first_release: 2015
    measures: Logic optimisation and synthesis; submitted LUT-6 size/depth results are equivalence-checked and kept as best-result records per competition cycle.
    urls: ["https://github.com/lsils/benchmarks"]
    evidence: IWLS 2015 origin; README announces 2026 competition results and a 2027 cycle; 267 stars.
  - name: VerilogEval
    variants: [v1, v2 (Revisiting VerilogEval)]
    subdomain: circuit-eda
    grade: S
    first_release: 2023
    measures: LLM Verilog generation on 156 HDLBits problems, pass@k by simulation against golden outputs.
    urls: ["https://arxiv.org/abs/2309.07544", "https://arxiv.org/abs/2408.11053", "https://github.com/NVlabs/verilog-eval"]
    evidence: NVIDIA-maintained; ICCAD 2023 invited paper; 476 stars; ~460 citations.
    spot_checked: true                  # arXiv 2309.07544 200
  - name: RTLLM
    variants: [v1, "2.0"]
    subdomain: circuit-eda
    grade: S
    first_release: 2023
    measures: Natural-language-to-RTL generation scored on syntax, function and design quality (PPA).
    urls: ["https://arxiv.org/abs/2308.05345", "https://github.com/hkust-zhiyao/RTLLM"]
    evidence: ASP-DAC; ~289 citations; 232 stars.
  - name: CVDP (Comprehensive Verilog Design Problems)
    subdomain: circuit-eda
    grade: S
    first_release: 2025
    measures: 783 problems in 13 categories (RTL generation, verification, debugging, Q&A), agentic and non-agentic; pass@1 with open-source tools plus BLEU/LLM-judge for comprehension.
    urls: ["https://arxiv.org/abs/2506.14074", "https://github.com/NVlabs/cvdp_benchmark"]
    evidence: NVIDIA; 226 stars; README reports Si2 adopting it into an LLM Benchmarking Coalition leaderboard.
  - name: ChiPBench
    subdomain: circuit-eda
    grade: M
    first_release: 2024
    measures: AI chip-placement algorithms scored on end-to-end PPA through an open-source flow over 20 circuits.
    urls: ["https://arxiv.org/abs/2407.15026", "https://github.com/MIRALab-USTC/ChiPBench"]
    evidence: NeurIPS 2025 Datasets & Benchmarks; 76 stars.
  - name: AnalogGym
    subdomain: circuit-eda
    grade: M
    first_release: 2024
    measures: Analog circuit synthesis and sizing on 30 topologies with SPICE-evaluated specifications.
    urls: ["https://arxiv.org/abs/2409.08534", "https://github.com/CODA-Team/AnalogGym"]
    evidence: ICCAD 2024; reused by AnalogGym-Opt (IEEE TCAD 2026); 92 stars.

  # --- cad-geometry-generation ---------------------------------------------------------------
  - name: CADPrompt
    subdomain: cad-geometry-generation
    grade: M
    first_release: 2024
    measures: Text-to-CAD code generation on 200 prompts with expert CAD code; point-cloud distance and success rate.
    urls: ["https://arxiv.org/abs/2410.05340", "https://github.com/Kamel773/CAD_Code_Generation"]
    evidence: ICLR 2025; ~78 citations. Introduced inside a method paper (CADCodeVerify).
  - name: CADGenBench
    subdomain: cad-geometry-generation
    grade: M
    first_release: 2026
    measures: STEP-part generation from an engineering drawing and STEP editing, scored by a CAD-score pipeline on a hosted leaderboard.
    urls: ["https://github.com/huggingface/cadgenbench"]
    evidence: Hugging Face-maintained; public leaderboard; 130 stars. About four months old.
    spot_checked: true                  # repo 200
  - name: Parametric CAD Bench (cadbench.ai)
    variants: [V1, V2, V3]
    subdomain: cad-geometry-generation
    grade: M
    first_release: 2026
    measures: Agents on FreeCAD tasks (creation, create-and-edit, drawing-to-CAD); leaderboard reports score and cost.
    urls: ["https://cadbench.ai", "https://github.com/gNucleus-AI/cad-bench-submission"]
    evidence: Versioned industry-hosted leaderboard with current frontier agents.
    naming_collision: The bare name CADBench is used by at least three unrelated projects; catalogue under this name, never the bare one.
  - name: CadEval
    subdomain: cad-geometry-generation
    grade: W
    first_release: 2025
    measures: Text-to-OpenSCAD/STL for simple mechanical parts, geometry checks against reference meshes.
    urls: ["https://github.com/wgpatrick/cadeval", "https://epoch.ai/benchmarks/cad-eval"]
    evidence: Tracked on Epoch AI's hub; 51 stars; only 25 tasks, which its own README calls insufficient; single author.
    planning_candidate: true            # named by the recon

  # --- structural-mechanical-design ----------------------------------------------------------
  - name: EngDesign
    subdomain: structural-mechanical-design
    grade: M
    first_release: 2025
    measures: 101 design tasks across nine engineering domains, graded by simulation-based scripts; leaderboard.
    urls: ["https://arxiv.org/abs/2509.16204", "https://github.com/AGI4Engineering/EngDesign"]
    evidence: NeurIPS 2025 Datasets & Benchmarks. Spans control and digital design too; assign it once.
  - name: DesignQA
    subdomain: structural-mechanical-design
    grade: M
    first_release: 2024
    measures: Multimodal LLMs applying engineering requirements (Formula SAE rules, CAD images, drawings).
    urls: ["https://arxiv.org/abs/2404.07917", "https://design-qa.github.io/"]
    evidence: J. Computing and Information Science in Engineering; MIT and Autodesk Research; leaderboard.
  - name: FEABench
    subdomain: structural-mechanical-design
    grade: M
    first_release: 2025
    measures: LLMs and agents solving finite-element problems end to end through the COMSOL API.
    urls: ["https://arxiv.org/abs/2504.06260", "https://github.com/google/feabench"]
    evidence: Google-maintained; NeurIPS 2024 workshops. 14 stars.
  - name: EngiBench (IDEAL Lab)
    subdomain: structural-mechanical-design
    grade: M
    first_release: 2025
    measures: Design-optimisation and ML algorithms on simulator-backed problems (beams, heat conduction, airfoils, photonics).
    urls: ["https://arxiv.org/abs/2508.00831", "https://github.com/IDEALLab/EngiBench"]
    evidence: NeurIPS 2025; reused by later work.
    naming_collision: An unrelated LLM benchmark (arXiv 2509.17677) has the same name; see the next entry.
  - name: EngiBench (hierarchical LLM engineering problems)
    subdomain: structural-mechanical-design
    grade: M
    first_release: 2025
    measures: Three-level engineering problem solving with perturbed and abstracted variants.
    urls: ["https://arxiv.org/abs/2509.17677"]
    evidence: ACL 2026 Findings.

  # --- process-control-optimization ----------------------------------------------------------
  - name: ControlBench
    variants: [ControlBench, ControlBench-C]
    subdomain: process-control-optimization
    grade: M
    first_release: 2024
    measures: 147 undergraduate classical-control design problems, expert-graded; ControlBench-C is 100 of them as multiple choice.
    urls: ["https://arxiv.org/abs/2404.03647", "https://agi4engineering.github.io/LLM4Control/"]
    evidence: ~69 citations; arXiv only; human grading.
    spot_checked: true                  # arXiv abstract 200; wording matched
  - name: PC-Gym
    subdomain: process-control-optimization
    grade: M
    first_release: 2024
    measures: RL environments for chemical process control, scored against NMPC oracles under constraints and disturbances.
    urls: ["https://arxiv.org/abs/2410.22093", "https://github.com/MaximilianB2/pc-gym"]
    evidence: Computers & Chemical Engineering; 96 stars.
  - name: Tennessee Eastman Process challenge
    subdomain: process-control-optimization
    grade: S
    criterion_b: borderline             # a challenge problem, not a leaderboard
    first_release: 1993
    measures: Canonical plant-wide control and monitoring challenge, scored on operating cost and constraints, or fault-detection rates.
    urls: ["https://depts.washington.edu/control/LARRY/TE/download.html"]
    evidence: Thirty years of use; archive hosts updated code and many control solutions. Original 1993 paper not fetched.

  # --- experimental-apparatus-design ---------------------------------------------------------
  - name: Learn2Design 2026
    subdomain: experimental-apparatus-design
    grade: M
    first_release: 2026
    measures: Algorithms optimising ~200 continuous parameters of gravitational-wave detector designs in a JAX simulator, ranked on hidden topologies via Codabench.
    urls: ["https://github.com/artificial-scientist-lab/Learn2Design-2026", "https://learn2design2026.com/"]
    evidence: Accepted NeurIPS 2026 competition; repo created 2026-05-15; 51 stars.
    planning_candidate: true
    spot_checked: true                  # repo metadata matched; README title "NeurIPS 2026 Challenge: Learn2Design-2026"

  # --- lab-automation-execution --------------------------------------------------------------
  - name: LAB-Bench
    variants: [LAB-Bench, LABBench2]
    subdomain: lab-automation-execution
    grade: S
    first_release: 2024
    measures: 2,400+ practical-biology questions; ProtocolQA and Cloning Scenarios are the subsets that fit this subdomain.
    urls: ["https://arxiv.org/abs/2407.10362", "https://github.com/Future-House/LAB-Bench"]
    evidence: FutureHouse; ~180 citations; reported in a frontier-lab preparedness report.
    primary_domain_question: Likely biology-genetics primary with this subdomain as secondary.
  - name: BioPlanner (BioProt)
    subdomain: lab-automation-execution
    grade: M
    first_release: 2023
    measures: Protocol planning -- reconstructing pseudocode protocols from high-level descriptions, scored automatically.
    urls: ["https://arxiv.org/abs/2310.10632", "https://github.com/bioplanner/bioplanner"]
    evidence: EMNLP 2023; ~56 citations.
  - name: BioProBench
    subdomain: lab-automation-execution
    grade: M
    first_release: 2025
    measures: Biological protocol reasoning over 22k protocols with task-specific metrics.
    urls: ["https://arxiv.org/abs/2505.07889", "https://github.com/YuyangSunshine/bioprobench"]
    evidence: ICML 2026 per its repository; 72 stars; only ~4 citations.
  - name: LabUtopia
    subdomain: lab-automation-execution
    grade: M
    first_release: 2025
    measures: Embodied agents on laboratory manipulation and long-horizon experiments in an Isaac Sim suite, five task levels.
    urls: ["https://arxiv.org/abs/2505.22634", "https://github.com/Rui-li023/LabUtopia"]
    evidence: NeurIPS 2025 Datasets & Benchmarks.

considered_not_tier1:
  # The two recon candidates that did not survive -- the headline correction to 02 S3.
  - name: AutoLabs
    url: https://github.com/pnnl/AutoLabs
    reason: A PNNL multi-agent system; its repo describes "a Streamlit-based application for designing, simulating, and evaluating chemical experiments". Its five experiments are an internal evaluation, not a benchmark.
    planning_candidate: true
    spot_checked: true
  - name: Blueprint-Bench 2
    url: https://andonlabs.com/evals/blueprint-bench-2
    reason: Real and Epoch-tracked, but it converts apartment photos to floor plans -- spatial reasoning, not engineering design. Belongs under reasoning-general/spatial-reasoning.
    planning_candidate: true
  - {name: CircuitNet, url: "https://arxiv.org/abs/2208.01040", reason: Describes itself as a dataset.}
  - {name: OpenABC-D, url: "https://arxiv.org/abs/2110.11292", reason: Describes itself as a dataset.}
  - {name: AnalogCoder, url: "https://arxiv.org/abs/2405.14918", reason: "Method paper whose benchmark is reused; borderline, could be promoted."}
  - {name: Text2CAD, url: "https://arxiv.org/abs/2409.17106", reason: "Method plus annotated dataset; its test split is a de-facto eval."}
  - {name: DeepCAD, url: "https://github.com/rundiwu/DeepCAD", reason: "Method paper; dataset used as a de-facto eval."}
  - {name: DrivAerNet++ / CarBench, url: "https://github.com/Mohamedelrefaie/DrivAerNet", reason: "CFD dataset plus leaderboard; Tier-1 only if aerodynamic surrogates are in scope."}
  - {name: L2RPN / Grid2Op, url: "https://l2rpn.chalearn.org/", reason: "Power-grid control competition; earth-climate/energy-systems or here -- a boundary decision."}
  - {name: CityLearn Challenge, url: "https://www.citylearn.net/citylearn_challenge/index.html", reason: "Building energy control; same boundary decision."}
  - {name: safe-control-gym, url: "https://github.com/learnsyslab/safe-control-gym", reason: "Robotics control; robotics-embodiment is the likelier home."}
  - {name: NL4Opt, url: "https://nl4opt.github.io/", reason: "Optimisation-model formulation (NeurIPS 2022 competition); mathematics/applied-modeling is the likelier home."}
  - {name: LabSafety Bench, url: "https://arxiv.org/abs/2410.14182", reason: "Lab-safety knowledge, not execution."}

unverified:
  - ISPD per-contest scoring rules (the contests index and ACM DL returned 403; editions and winners pages were fetched)
  - DAC System Design Contest editions before 2023 (root site 404)
  - IWLS contest as a family separate from the EPFL suite records
  - Tennessee Eastman original 1993 paper (only the challenge archive fetched)
  - Citation counts for VerilogEval v2, CVDP, AnalogCoder and EngDesign (Semantic Scholar rate-limited)

tier2_estimate:
  label: estimate, not a count
  named_in_survey: ~20
  total: 40-60
  ceiling: ~80
  basis: >
    ~20 plausible Tier-2 families named during the sweep (recent CAD and RTL LLM suites, older
    EDA contest series, control benchmarks) plus 20-35 more seen in search results and not
    chased. Growth is concentrated in 2026 CAD and RTL benchmarks.

scoping_concerns:
  # Findings for the vocabulary owner (P0-S2-T07, subdomain definitions); not edits.
  - subdomain: experimental-apparatus-design
    concern: One credible family in the whole field. Merge into a broader design-optimisation subdomain, or keep it knowing it stays thin.
  - subdomain: process-control-optimization
    concern: Admitting energy-grid control, building control and OR formulation roughly doubles it; the boundary with earth-climate/energy-systems and mathematics/applied-modeling needs a rule.
  - subdomain: lab-automation-execution
    concern: Three of four families are biology-protocol benchmarks; decide the primary domain for each once.
  - naming:
      concern: Three name collisions -- EngiBench (two unrelated families), CADBench (three unrelated projects), and LabUtopia's embedded "LabBench" versus FutureHouse's LAB-Bench. Entry ids must disambiguate.
