  - phase: 1
    phase_title: "Seed the index, breadth-first"
    phase_goal: "320 source-verified benchmark families exist across all 19 domain families with the per-entry curation rate measured rather than estimated, and the taxonomy and gap matrix are published under CC-BY with a resolving DOI months before the catalogue."
    entry_condition: "Phase 0 complete: schema/*.py validating the ten stress entries with zero errors and zero escape-hatch fields; taxonomy/*.yaml carrying the 108 spine term records, capability_groups.yaml, domain_groups.yaml and homographs.yaml; the bench CLI's new/validate/build; tools/validate/quotes.py; CI blocking on tiers 1-3 with checks 9f, 9g and 9h green; LICENSE-DATA, LICENSE-CODE, REUSE.toml, CITATION.cff, SUCCESSION.md and the reserved Zenodo concept DOI; ADRs 0001-0006."
    exit_gate: ">=290 benchmarks (320 targeted) across 19 of 19 populated domain families, none below 12 unless muted under the floor rule; >=130 entries across the seven Core families with none below 18; zero validation errors and every quality warning triaged rather than suppressed; either a named specialist reviewer has signed off on each of three unfamiliar domains or every unsigned domain carries curation_confidence: unreviewed on every entry and in the coverage map; the schema has not changed in the last 40 entries; taxonomy/ is published with a resolving DOI and the gap-matrix preprint is posted."
    parallelisable: "P1-S1 (taxonomy) blocks all curation - critical-path dependency 1 in 14-roadmap.md - so nothing in P1-S5..P1-S11 may start before P1-S1-T07. P1-S2 (copilot, dedup, instrumentation, archival) runs fully in parallel with P1-S1: it is engineering and touches no vocabulary. P1-S4 starts in week 2 and runs across the whole phase; it is the only workstream with a three-month lead time, and P1-S4-T03 depends on P1-S3-T02 only so that two or three finished entries exist to attach to the ask. P1-S5..P1-S11 are mutually independent after the checkpoint, and within each family the tranches are strictly serial. At one person the curation stages are serial and the phase runs to the top of its 9-25 week range; per 14-roadmap.md \"Overlap is a function of headcount\", overlapping engineering onto curation at one person does not compress the schedule, it slows curation. At two people with a clean curation/engineering split, the split buys P1-S2 and P1-S12's tooling and the Phase 2 engineering, not the curation hours. P1-S12's sweeps each depend on the family they sweep already being curated, so they interleave with P1-S5..P1-S11 rather than following them. P1-S14-T01..T05 (the IRR round) must be initiated roughly two months before the freeze per 03 S6.5, which places them alongside the late curation stages rather than after them. Cost of parallelism: the only genuinely free parallelism is S2 against S1; everything else is either serialised by the critical path or costs curator attention, which is the binding constraint."
    stages:
      - id: P1-S1
        title: "Taxonomy stress corpus, classification and revision"
        goal: Put the Phase 0 vocabulary through 90 real benchmarks and fix it before 300 entries are tagged against it.
        tasks:
          - id: P1-S1-T01
            seq: 70
