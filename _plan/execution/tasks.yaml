  - phase: 5
    phase_title: Ingestion at scale and freshness automation
    phase_goal: "Ingestion stops being one hand-run script and becomes a scheduled, self-monitoring pipeline that drafts more than half of all new claims for human approval, while staleness and upstream death become visible to readers rather than only to maintainers."
    entry_condition: "Phase 4 has exited (public v1: DOI minted, coverage and gap views live). Phase 3's Epoch adapter (`ingest/epoch.py`) exists and has survived one hand-run bulk ingest, carrying the shared YAML emitter, content-derived claim ids, the unit guard, the sanity band and the caps. Phase 1's Wayback SPN2 + CDX archiver exists. The three ingestion schema additions in 07 §12 are ratified, or are picked up by P5-S2-T08."
    exit_gate: "All five criteria in 14-roadmap.md \"Phase 5 -> Exit criteria\" hold: (1) >=50% of new claims originate from ingestion drafts with human approval, measured by `bench report ingest-share`; (2) no entry on `main` unverified for over 12 months without a visible flag on its page; (3) zero dead unarchived source links; (4) a deliberately broken adapter -- the SWE-bench script tag renamed in a fixture -- hard-fails and opens an issue rather than writing nulls; (5) arXiv triage precision and recall measured on our own labelled set of at least 200 papers, with the measured numbers replacing the estimates in 14-roadmap.md. Recorded at the P5-S8-T05 human gate."
    parallelisable: "S1 -> S2 is strictly serial: the ABC must exist before the shared runner is written onto it (07 S11.5 step 3). After S2, three tracks run concurrently and touch disjoint files: the adapter track (S5 then S6, sharing ingest/adapters/ and the fetcher), the pipeline track (S3 then S4, sharing .github/workflows/ and ingest/runner/), and the freshness track (S7 then S8, sharing site/ and tools/report/). At two people on the 06/07 split -- one curation-facing, one engineering-facing -- the adapter track and the freshness/site track genuinely run alongside each other, and Phase 5 compresses to roughly the length of the adapter track plus S1-S2. At one person there is no compression at all: the phase table's totals already assume serial execution, and context-switching between debugging an OAI-PMH resumption token and reviewing an ingest PR is the same hours spent worse. Two cross-track edges constrain it: S7-T01 (liveness) needs S5-T01's GitHub signals and S6-T06's Grand Challenge lifecycle data, and S6-T04 (the breakage drill, exit criterion 4) needs both S6-T03 and S4-T05. S3-T01 (the bot PAT) is a human task with no dependencies and should be started on day one, because everything in S3 after T03 waits on it and it can sit in an inbox. S6-T01 and S6-T08 (licence correspondence and reading) likewise have zero dependencies, multi-week third-party latency, and gate promotion out of the discovery trees -- start them in week one of the phase, not when the adapters are ready."
