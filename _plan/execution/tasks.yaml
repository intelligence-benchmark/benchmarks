  - phase: 3
    phase_title: "Result claims, provenance, and the Epoch ingestion adapter"
    phase_goal: "Every number in the index carries its conditions and its provenance: the Epoch corpus is ingested in bulk and badged honestly, 110-160 claims are hand-curated with at least 60 from non-LLM domains, and the build refuses to compare claims whose conditions differ."
    entry_condition: "Phase 0 exited: the four C5 schema additions, the `ingestion` block and `IngestBatch`, the alias tables and resolution rule, `Baseline`, `Metric.optimum/unbounded/range`, `taxonomy/thresholds.yaml`, CI tiers 1-3, and `bench validate|build|archive|resolve` all exist (04 §15 items 1-21). Phase 1 exited: >=290 benchmarks across 19 populated domain families with Core families at 18+, so every benchmark a claim points at already exists, and the eight non-LLM sources of record are curated entries. Phase 2's Astro build pipeline and benchmark detail pages exist -- required only by stage S10, so S1-S9 may start before Phase 2 finishes."
    exit_gate: "14-roadmap.md §\"Phase 3 -- Exit criteria, and a restated target\", in full: >=130 claims at `condition_completeness` >= 0.6, each with a named source and an archived URL, of which >=60 are from non-LLM domains; the full Epoch bulk ingest present, segregated under `data/claims/_ingested/epoch/`, badged, with its mean `condition_completeness` published whatever it turns out to be; the four verification rules accounting for all 6,598 rows with the `unmatched` count published; every claim carrying exactly one source and one conditions record; conflicting claims rendering side by side without the index adjudicating; a cross-condition comparison producing a field-level diff warning rather than a ranking; headroom `null` with a stated machine-readable reason wherever it is undefined, with the reason distribution published; and no automated dedupe having run, near-duplicates surfaced in a quality dashboard instead."
    parallelisable: "Two independent tracks after entry, and they are exactly the curation/engineering split 14-roadmap.md §\"Overlap is a function of headcount\" describes. ENGINEERING TRACK: S1 -> S2 -> S3 -> S4, then S9 (once S6 lands) -> S10. CURATION TRACK: S5 and S6, then S7 and S8, which run concurrently with each other and internally parallel across families. The only hard cross-track edges are S10-T01/T02 -> S4-T08 (completeness is per-profile, so the profile lookup must exist before the ingest can report its own completeness), S4-T08 -> S5-T05 (picking the thinnest-conditioned benchmarks needs the ingest measured) and S4-T08 -> S10-T07. At two people this compresses the phase to roughly the engineering track plus the tail of S8, about 9-13 weeks. AT ONE PERSON THE TRACKS SERIALISE and the total is the upper end: 14-roadmap.md is explicit that context-switching between curating a robotics entry and debugging an adapter is not parallelism, it is the same hours plus the switching cost, and that overlapping engineering onto curation slows curation rather than compressing the schedule. Within S7 and S8, the per-family batches are independent of each other once their S6 anchors task is done, so a second curator can be added at any point without re-sequencing. S2-T03/T04 (79 stanzas) and S3-T05 (927 aliases) are the two tasks that most reward a second pair of hands and least reward AI assistance, because both are dominated by human adjudication."
