# Execution backlog for the Universal AI Benchmark Index.
#
# Human-readable form: ../16-execution-plan.md  (generated from this file; never hand-edit it)
# Checked by:          ../_workflow/scripts/verify_execution.py
# Executed with:       ../_workflow/scripts/next_task.py
#
# executor  who does the task:
#   agent        an agent does it end to end and verifies it
#   agent-draft  an agent produces it; a person must review before it counts as done
#   human        needs an account, a signature, a legal reading, or a person
#   human-gate   a decision that stops the pipeline; no artifact
#
# seq       the execution order. Work tasks in ascending seq: it is a topological
#           sort of depends_on, so every input of a task is already produced when
#           its turn comes. Document order is grouped for reading and is NOT safe to
#           execute directly -- seven tasks sit before something they depend on.
# produces  paths this task CREATES. Exactly one task may create a path.
# modifies  paths this task EDITS that another task created. A task that only
#           edits has an empty produces, which is legitimate.
#
# THE LEDGER -- the only fields an executor writes. Change them with next_task.py,
# not by hand: it refuses transitions the ledger cannot honestly record.
#
# status    todo     not started
#           doing    an executor has started it
#           review   agent-draft only: the artifact exists and verify passed; waiting
#                    for a person. Without this state a finished draft and a half-
#                    written one look identical.
#           blocked  cannot proceed; blocked_reason says why. Human and human-gate
#                    tasks wait here, so an unattended run moves past them.
#           done     finished. Set only after verify has actually run and passed.
# signed_off_by, signed_off_on
#           required on every done task a person is involved in (agent-draft, human,
#           human-gate). A sign-off with no name is not one.
# blocked_reason   required while blocked.
# review_note      why a draft was returned, or a note left at sign-off.
#
# What a task's inputs must be:
#   to finish (done)           every input done. This forces review into seq order.
#   to start an agent task     every input done. Agent work is never reviewed, so it
#                              must never rest on an unreviewed draft.
#   to start an agent-draft    every input done or in review. Drafting on a draft is
#                              allowed because a person reviews this one too; the
#                              cost is rework if the lower draft is rejected.

