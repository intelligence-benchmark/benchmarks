  - phase: 8
    phase_title: Local evaluation runner, shipped in the package
    phase_goal: "`bench run` executes a benchmark on the user's own infrastructure with the user's own keys and emits a RunRecord they own, so the catalogue gains reruns without gaining a compute bill. At least 10 benchmarks produce sandboxed-rerun claims through the normal contribution path, with archived transcripts and first-class EvalConditions. The scope gate in 13-execution-runners.md S0.1 governs how far past the first adapter this goes, not whether it happens."
    entry_condition: "Phases 0-6 have shipped (14-roadmap.md §0.4 sequencing: the gate sits on top of, not instead of, the ordering). Public v1 has been live for six months and docs/adoption/ carries two recorded measurements inside that window. Phase 7 has shipped the package the runner lives inside, which is the real prerequisite. Stage P8-S1 may begin at the end of Phase 4, and its instruments now size the phase rather than decide it: per 13-execution-runners.md S0.1 the first adapter is built unconditionally, and the gate controls whether a second adapter, scheduled reruns and the public execution pages follow. The Phase-0 schema preconditions in 13-execution-runners.md §9 (runnable_via, inspect_evals_id, maintainer_rerun_policy, provider_snapshot/_available, artifact_url, provenance_snapshot, the three-class material-field partition and its CI totality check) must already be shipped and populated."
    exit_gate: "From 14-roadmap.md §\"Phase 8\": \">=10 benchmarks producing `sandboxed-rerun` claims through the normal contribution path, with transcripts archived and every run's conditions recorded as a first-class EvalConditions entity.\" 13-execution-runners.md §8 adds five further criteria that the roadmap's exit does not restate: >=2 adapters with one agentic/containerised; every self-produced claim at condition_completeness == 1.0; a live public spend page showing the inference/storage and measured/estimated splits; zero privileged writes to data/ verified by the same CI that gates contributor PRs; the §4.4 divergence test green for every field in every adapter's recovers_material_fields and the field-class partition check green for every comparability profile. All six are checked by `python scripts/check_phase7_exit.py` (P8-S7-T01), and the exit review is recorded at P8-S7-T05. The legitimate alternative exit is P8-S1-T09: the gate failed, and the roadmap page says so with the measurement attached."
    parallelisable: |-
      At one person nothing in P8-S2 through P8-S7 is genuinely parallel; 14-roadmap.md's "Overlap is a function of headcount, not of scheduling" applies unchanged, and the stage totals assume serial execution.
      
      At two people with a clean split, four things run concurrently and are worth the split. (1) P8-S1 runs entirely alongside Phases 5 and 6 — it is measurement, not build, and it costs nothing downstream if the gate fails. (2) P8-S2's three human tasks (T01 provider ToS reads, T02 hard-cap survey, T03 R2 and credentials) plus T05's maintainer correspondence have multi-week lead times and block only P8-S4 and P8-S5; they should run alongside the whole of P8-S3, and starting them late is the most likely way this phase stalls. (3) P8-S3-T09, the Every Eval Ever serialiser, depends only on P8-S3-T02 and is independent of T04 through T08 — it is the natural filler when a live test is blocked on an API. (4) P8-S6-T03 through P8-S6-T05 (spend page, funding disclosure, methods page) are front-end and documentation work independent of P8-S5's adapter, and are the obvious second track while the agentic adapter (20-34 h, the single largest task in the phase) is in progress.
      
      What that costs: the two-person split needs the engineering person to hold both the runner and the site build in their head, and P8-S6-T04 is a schema change requiring two named reviewers, so it serialises against whatever else needs review that week. Nothing else in the phase has a review queue between the two tracks.
      
      What must stay serial regardless of headcount: P8-S1-T08 gates everything after it; P8-S3-T04 -> T05 -> T06 -> T08 is a true chain (the adapter must exist before its recovered fields can be proven, and they must be proven before a claim builder can compare against them); P8-S5-T01 -> T04 -> T05 is a true chain (keys must exist before the monthly cap can be enforced by provisioning, and both before the runaway test means anything); and P8-S7-T01 cannot run until P8-S4, P8-S5 and P8-S6 have all landed.
    stages:
      - id: P8-S1
        title: "The evidence gate: instrument it, measure it, make \"no\" cheap"
        goal: "Produce a defensible go/no-go on Phase 8, and make the \"no\" a published, dated, two-hour outcome rather than a perpetual \"coming soon\"."
