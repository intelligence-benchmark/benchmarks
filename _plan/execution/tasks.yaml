              - 02-taxonomy.md S3
            steps:
              - Copy the 18-family allocation from 03 S3.2 verbatim; do not rebalance it.
              - Resolve each named entry to a live URL and a primary paper.
              - Confirm the ten bolded stress tests are present by construction.
              - Leave engineering-design empty and record the reason in the file header.
            produces:
              - taxonomy/_corpus/stress-corpus.yaml
            verify: "python -c \"import yaml,collections;d=yaml.safe_load(open('taxonomy/_corpus/stress-corpus.yaml'));c=collections.Counter(e['domain_family'] for e in d['entries']);assert len(d['entries'])==90 and len(c)==18, (len(d['entries']),len(c))\""
            done_when: "The corpus file holds exactly 90 entries across exactly 18 families, engineering-design absent by declaration."
