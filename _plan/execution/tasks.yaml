              - 12-analytics-and-trends.md S5.1
              - 02-taxonomy.md S4.3
            steps:
              - Load every benchmark at completeness `full` from data/benchmarks/.
              - "Roll each entry's capability terms up through taxonomy/capability_groups.yaml."
              - "Compute the mean number of distinct groups per entry, with n and date."
              - Write the result to _health/collapse-factor.json and compare against 3.3.
              - File an ADR if the measured factor differs from 3.3 by more than 20%.
            produces:
              - scripts/collapse_factor.py
              - _health/collapse-factor.json
            verify: uv run python scripts/collapse_factor.py --check --min-entries 200
            done_when: "The measured collapse factor, its n and its date are committed, and an ADR exists if it moved more than 20% from 3.3."
            est_hours_low: 1
            est_hours_high: 2
