  - phase: 4
    phase_title: "Coverage, gaps, ecosystem view, release feed -> public v1"
    phase_goal: "A curated, claim-bearing catalogue becomes a citable public v1: the coarse 19x13 coverage grid, a Gap Finder restricted to review-backed domains, the ecosystem and trust surfaces, the release feed, the croissant-benchmark extension and a resolving DOI all exist and are verified."
    entry_condition: "Phase 3 exited: >=130 hand-curated claims at condition_completeness >= 0.6 with >=60 non-LLM, the Epoch bulk ingest present and segregated under data/claims/_ingested/epoch/ with its unmatched count, headroom and saturation bands computed with null reasons, comparability_key computed in the build, V5 Comparison Workbench and V6 detail pages live. Phase 1 exited at >=290 benchmark families across 19 of 19 domain families, with reviewer outreach begun and at least three unfamiliar domains signed off or every unsigned domain badged. Phase 2's Astro site, design system, CI gate set and per-benchmark croissant.jsonld emission are in place."
    exit_gate: "All seven Phase 4 exit criteria in 14-roadmap.md are green: (1) headroom computed for >=60% of benchmarks with established baselines and null handled visibly with a stated reason everywhere else; (2) the coverage map shows curation confidence alongside density; (3) the Gap Finder surfaces at least one gap the maintainers did not already know about, within a review-backed domain; (4) every unreviewed domain renders \"insufficient curation confidence to assert a gap\" rather than an empty cell; (5) a researcher unfamiliar with a domain can orient in it in under five minutes; (6) the DOI resolves and the CC-BY YAML at that commit hash downloads as a single archive; (7) the Croissant extension issue is filed on the MLCommons repository and the three worked examples validate against our own context. Recorded by P4-S7-T09."
    parallelisable: "S1 is a hard serial prefix: nothing in S2 can honestly emit a number before taxonomy/not-applicable.yaml, reviewer_signoff and the survey notes exist, and S1-T02/T05/T06 are curation, not engineering, so they do not speed up with more compute. From there S2 -> S3 is a chain. But S4 (Saturation Wall, Frontier Timeline, Release Feed) and S6 (Croissant) are fully independent of S1, S2 and S3 -- S4 needs only Phase 3's headroom.json and the Phase 2 site shell, S6 needs only Phase 2's croissant.jsonld emission -- so both can run from day one of the phase. S5 forks after P4-S2-T06 (the citation adapters) and rejoins only at S7. Within S3, T02-T05 can run concurrently once T01 lands; within S7, T01-T04 and T06-T07 are independent of each other. At one person the phase is effectively serial and the 4.5-8.5 week estimate stands. At two people the only split that buys anything is curation (S1-T02/T05/T06, S3-T08, S7-T08) against engineering (everything else); it takes roughly a week off the top end and no more, because the curation prefix is what gates S2 and S3 and it does not parallelise across two people unless both are curating. Running S4 and S6 concurrently with S1 is the single cheapest overlap available and costs nothing, because neither touches taxonomy/ or data/."
    stages:
      - id: P4-S1
        title: Preconditions for an honest coverage claim
        goal: The inputs that make a published coverage or gap number defensible exist as committed data before any view is drawn.
        tasks:
          - id: P4-S1-T01
            seq: 320
            title: Re-validate the 3.3 capability-group collapse factor against real tag co-occurrence
            executor: agent
            status: todo
            depends_on:
              - P1-S13-T06
