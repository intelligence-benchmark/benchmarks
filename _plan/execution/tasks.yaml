  - phase: 9
    phase_title: Hosted API and community submissions
    phase_goal: "The two surfaces that let people who are not maintainers lean on the catalogue and write to it: a query layer over the same artifacts for the joins and point lookups static files serve badly, and a submission path by which an outsider's own run becomes a reviewed, badged claim - without either becoming something the repository depends on."
    entry_condition: "Phase 7 has shipped the package and Phase 8 the runner, because a submission is a RunRecord the runner emits and the API's compare endpoint reuses the package's comparability code. Public v1 has been live long enough that the corrections and disputes paths in 05 have been exercised at least once, because submissions will exercise them far harder."
    exit_gate: "Every REST endpoint answers from the published artifacts with its provenance attached and none holds state git does not hold; the rate limiter sheds load to a 429 naming the static artifact that answers the same question; the spend cap returns 503 rather than incurring a charge, proved under load; a submitted RunRecord with a missing mandatory field is rejected at the API with the field named; a valid submission opens a draft PR and writes nothing to data/; no submission path can promote a claim above the rung its evidence supports; and the whole catalogue, package and site still work with the API switched off, proved by a deliberate outage drill."
    parallelisable: "S1 blocks S2 and S3. S4 depends on the runner's RunRecord model and on S1's validation code but not on S2 or S3, so the submission half and the query half are genuinely independent after S1 and are the natural two-person split. S5 follows S4. S6 can be written alongside S5 because it is checks over a submission, not a stage in its path. S7 is the gate."
    stages:
      - id: P9-S1
        title: The REST read layer over the published artifacts
        goal: "Point lookups and filtered lists answer from the same artifacts the site and the package read, with no second database anywhere."
        tasks:
          - id: P9-S1-T01
