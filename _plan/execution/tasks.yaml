  - phase: 2
    phase_title: Public static site with the Atlas and detail pages
    phase_goal: "The catalogue becomes a public, citable, accessible static site: detail pages that render with JavaScript disabled, faceted browse and search, the Atlas with a proved drift gate, the design system enforced in CI, and a contribution path an outsider can use without git."
    entry_condition: "Phase 1 has exited: >=290 benchmarks, 19 of 19 domain families populated, zero validation errors, the schema unchanged over the last 40 entries, and taxonomy/ published with a resolving DOI. At two people on a clean curation/engineering split, the engineering half may start once the catalogue passes 100 entries; at one person this does not start until Phase 1 exits."
    exit_gate: "All eight exit criteria in 14-roadmap.md Phase 2 are green with a linked CI run, or explicitly waived with a recorded reason: landing page interactive < 2.0 s on a mid-tier mobile over simulated 4G; JS on any detail page = 0 KB, Atlas route <= 120 KB gzipped, detail page total weight <= 120 KB including fonts, enforced by size-limit and failing the job; the Atlas holds its frame budget while panning and while a facet filter is applied at 1,500+ nodes, measured nightly against a fixed synthetic 2,000-node corpus; client-side full-text search returns a first result in < 100 ms in the same nightly run; every benchmark has a stable citable URL that renders with JavaScript disabled; Atlas clustering produces visually obvious domain structure; the CI drift gate has failed at least once on a deliberate perturbation and an atlas_epoch.yaml bump has cleared it once; Axe/Pa11y pass with zero WCAG 2.2 AA violations across the eight archetype pages, the Atlas and facet UI are fully keyboard-operable including the non-drag selection path (SC 2.5.7), and check_contrast.py is green in both themes; and an outsider has successfully added a benchmark through the issue form without touching git."
    parallelisable: "At ONE PERSON this phase is strictly serial and runs to the upper end of every estimate; 14-roadmap.md's \"Overlap is a function of headcount, not of scheduling\" says so explicitly and this decomposition does not argue with it. At TWO PEOPLE on the curation/engineering split, the engineering person takes S1 then S3 while the second takes S2 then S5, with S4 going to whoever finishes first; that is the only configuration in which Phase 2 runs alongside Phase 1 at all. S6 is nearly independent of the view work — only T05 (the correction deep-link) and T08 (the outsider test) reach into S3 and S7 — so it is the natural thing to pick up whenever the view work blocks. The three human tasks with real lead time (P2-S7-T01 the Cloudflare account and domain, P2-S6-T03 the bot credential, P2-S6-T06 the repository settings) should be started in week one regardless of what else is happening, because nothing in S6 or S7 can be tested until they land and none of them is on anyone's critical path until it is. The genuine serialisation points are exactly three: P2-S1-T02 gates everything that reads an artifact; P2-S2-T01 gates every component and every design lint; and P2-S7-T02 gates P2-S5-T08, P2-S8-T05 and P2-S8-T06, because none of them can be measured against a deployment that does not exist. Within S5, T01–T04 (the shipping pack Atlas) and T05–T07 (the UMAP machinery and its gate) are independent of each other until T08 needs both, so a second person can take the UMAP branch without blocking the view."
    stages:
      - id: P2-S1
        title: Build pipeline and site skeleton
        goal: "The build emits the site's data artifacts and Astro renders from generated types."
        tasks:
          - id: P2-S1-T01
            seq: 181
            title: Scaffold the Astro app with pinned toolchain and explicit compressHTML
            executor: agent
            status: done
            depends_on: []
            reads:
              - 08-infrastructure-and-build.md S5.1
              - 10-visualization.md STechnology-decisions
              - 05-repository-and-workflow.md S2
            steps:
              - "Create site/ on astro@7.3.3, @astrojs/react@6.0.6, React 19, Node >=22.12."
              - "Set compressHTML: true explicitly, because 7.3.3 defaults to 'jsx' and eats whitespace between facet chips."
              - "Leave every content collection's schema undefined so there is one schema and one validator."
              - Commit site/package-lock.json and add a unit test asserting both properties.
            produces:
              - site/astro.config.mjs
              - site/package.json
              - site/package-lock.json
              - site/src/content.config.ts
              - site/test/config.test.mjs
            verify: cd site && npm ci && npx astro build && node --test test/config.test.mjs
            done_when: A clean checkout builds an empty Astro site and the test asserts compressHTML is literally true and that no collection declares a schema.
            est_hours_low: 1
            est_hours_high: 2
