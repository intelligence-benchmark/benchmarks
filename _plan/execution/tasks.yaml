              - 08-infrastructure-and-build.md S5.5
            steps:
              - Export potion-base-8M as an int8 matrix; prune the vocabulary to ~12k WordPiece rows unioned with every corpus token.
              - Wire @huggingface/tokenizers 0.2.0 (WordPiece + BertNormalizer) with no other dependency.
              - "Implement tokenise, row lookup, mean-pool, normalise in roughly 150 lines against a Float32Array."
              - Build a 200-string fixture and a Python reference vector for each.
            produces:
              - site/src/islands/search/encoder.ts
              - site/public/embed/potion-8m-pruned.i8.bin
              - site/public/embed/tokenizer.json
            verify: npm test -- encoder.parity
