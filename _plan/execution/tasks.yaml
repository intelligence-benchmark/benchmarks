            verify: "`npm run test:worker -- interest` passes: an affiliated submission carries the declared interest, it renders on the claim page, and no affiliated submission is silently dropped"
            done_when: A vendor's own number is published with the relationship visible.
            est_hours_low: 2.5
            est_hours_high: 4
