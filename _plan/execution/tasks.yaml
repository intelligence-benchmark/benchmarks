  - phase: 6
    phase_title: "AI layer: semantic search and suite builder"
    phase_goal: "The AI layer ships as a lens over an already-complete catalogue: deterministic retrieval works with the Worker entirely offline, every model call is bounded by a hard daily cap that degrades rather than bills, and no number on any AI surface was produced by a model."
    entry_condition: "Phase 5 exit met. facets.json, corpus.json, enums.json (with glosses), claims.json and derived/comparability.json are built and stable; comparability_key is computed; runnable_via, inspect_evals_id, execution.est_cost_usd and execution.est_runtime_hours are populated on enough entries to be usable; the catalogue is at >=290 benchmark families with the seven Core families at >=18. Public v1 (Phase 4) has shipped, because 11 §10's rule is that an AI increment slips whenever curation is behind, never the reverse."
    exit_gate: "All five of 14-roadmap.md Phase 6's exit criteria hold: (1) with the Worker disabled, facet, lexical and semantic search all still work and the site remains fully useful, readable and citable; (2) a synthetic load test of 5,000 requests in one hour trips the daily cap, degrades to deterministic retrieval with a visible footer status line, and produces no model charge above the cap — a hard gate before the endpoint is publicly reachable; (3) the abstention rate is published; (4) no number anywhere in the AI surface was produced by a model, every figure being computed in JavaScript from structured fields and shown with its formula; (5) measured per-call costs have replaced the estimates in 14 and 11 §5 after the first full month."
    parallelisable: |-
      At one person this is strictly serial and the phase table already prices it that way; 14's "Overlap is a function of headcount" section is explicit that context-switching is not parallelism. What follows is what a second pair of hands could take.
      
      S1 (AI-0, no model anywhere) and S2 (the Worker and G5, no model call yet) share no files and no artifacts: S1 is client-side TypeScript plus a Python build stage, S2 is `site/worker/` plus `wrangler.toml`. They run fully concurrently at two people. That is the single largest saving available, roughly 24-36 h off the critical path.
      
      S4 (the deterministic suite surface and the manifest export) contains no model call at all and depends only on Phase 2/4 artifacts plus P6-S4's own chain. It can run alongside S2 and S3 entirely. Its only edge into the model work is P6-S4-T02 feeding P6-S5-T01.
      
      Inside S2, the two human tasks (T02 Anthropic console limit, T04 Turnstile provisioning) are 30-60 minutes each and gate agent work behind them. Do them first, in one sitting, or T05 and T07 stall on a dashboard login.
      
      P6-S6-T02 (recruiting external reviewers for the non-LLM suite_build items) has a multi-week lead time and no dependency on any code. Start it the week S3 starts, not when S6 starts. Treated as a serial S6 task it will be the thing that holds the phase open.
      
      P6-S6-T01 (growing the golden set to 150) is 20-34 h of human labelling and is the largest single line in the phase. It runs alongside all of S5 once S5's synthesis path is callable. Do not serialise it after S5.
      
      What cannot be parallelised: S5 is a chain (Call A, then Call B, then streaming, then the post-validator), and S7 is a gate sequence by construction. P6-S7-T03 lags the rest of the phase by a full calendar month by definition.
