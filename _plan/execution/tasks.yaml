  - phase: 7
    phase_title: The package - SDK, CLI and MCP server
    phase_goal: "The catalogue becomes an installable object: pip install benchindex gives a typed client, a public CLI and an MCP server that answer exactly what the site answers, carry the same comparability refusals, and state the data version behind every answer - so a number used in a script and a number cited in a paper are the same number."
    entry_condition: "Public v1 has shipped (Phase 4 exit) and the build artifacts are stable at their published URL namespace. The AI layer is not required: the package's default path is deterministic and makes no model call. Phase 5's adapters are not required either, but the package is more useful after them because the catalogue is fresher."
    exit_gate: "benchindex is on PyPI with a reproducible wheel built by CI under Trusted Publishing; a cold `pip install benchindex` followed by the six documented calls in 17 S2 works against the live artifacts with no other setup; the package refuses to compare two claims whose comparability_key differs and names the differing fields; `Index(path=...)` works with the network disabled; every public model is asserted identical to the object in schema/; the MCP server answers all five tools against the live catalogue; and the offline failure path raises with the remedy named rather than returning an empty catalogue."
    parallelisable: "S1 must land first and blocks everything. After that S2 is the spine that S3, S4 and S5 all consume, so it is the critical path. S6 (MCP) depends only on S2 to S5's public surface and can run alongside S7. S7 (offline) is independent of S6 and touches only S2's resolution path. S8 is the gate. At two people the split is S3+S4 against S5+S6, which is roughly balanced; at one person the order below is the order."
    stages:
      - id: P7-S1
        title: Package skeleton, the API boundary and the release pipeline
        goal: "packages/benchindex/ exists as a buildable wheel with its public surface declared and its release path automated, so every later task adds to a boundary that is already enforced."
