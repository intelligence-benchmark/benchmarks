      - id: P9-S6
        title: Anti-gaming and contamination
        goal: "Faking a number is expensive, attributable and correctable - which is the claim this project can actually support."
        tasks:
          - id: P9-S6-T01
            seq: 591
            title: Require and record the contamination attestation
            executor: agent
            status: todo
            depends_on:
              - P9-S4-T03
            reads:
              - 18-api-and-submissions.md S4.5
              - 12-analytics-and-trends.md S:contamination
            steps:
              - "Require an explicit statement about training-data overlap; the absence of the question is how contaminated numbers get published."
              - "Cross-check the attestation against the benchmark's release date and the system's training cutoff, and flag the claim permanently where the benchmark predates the cutoff."
              - Render the flag on the claim rather than suppressing the claim.
              - Write tests/api/test_contamination.py covering the behaviour above, including the failure case its verification names.
            produces:
              - site/worker/api/contamination.ts
              - site/test/api/test_contamination.py
            verify: "`npm run test:worker -- contamination` passes: a missing attestation is rejected, a benchmark predating the cutoff is flagged, and the flag survives a round trip through the claim record"
            done_when: Every submitted claim answers the contamination question and the answer is permanent.
            est_hours_low: 3
            est_hours_high: 5
          - id: P9-S6-T02
            seq: 592
            title: Record declared interest where a submitter is the subject
            executor: agent
            status: todo
