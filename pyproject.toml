# pyproject.toml -- the repository toolchain (P0-S4-T01).
#
# Pins are exact on purpose: the Atlas layout's reproducibility depends on them
# (05 S3, 08 S5.3). Each pin, the registry value observed when it was checked, and the
# date of that check are in docs/pins.md; change the two together.
#
# Python is 3.12, not 3.13: scikit-learn 1.9.1 needs >=3.11 and the numba/UMAP stack lags new
# CPython (04 S12). The upper bound keeps uv from resolving for a CPython nobody tested.

[project]
name = "uaibi-tools"
version = "0.0.0"
description = "Repository toolchain for the benchmark catalogue: schema, validation, build."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.5",
    "ruamel.yaml==0.19.1",   # 04 S12 pipeline: data/**/*.yaml --ruamel.yaml--> dicts
    "typer==0.27.2",         # the bench CLI (05 S3)
]

# `uv run bench` (05 S3). The project installs editable, so tools/ and schema/ import from the tree.
[project.scripts]
bench = "tools.cli:main"

[project.optional-dependencies]
# The Atlas layout stack (08 S5.3: "Pin exactly umap-learn==0.5.12, numba, scikit-learn==1.9.1
# and numpy in the lockfile"). Optional so the schema and validator install without it.
atlas = [
    "scikit-learn==1.9.1",
    "umap-learn==0.5.12",
    "numba==0.67.0",
    "numpy==2.5.3",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "schema"]

[tool.uv]
# A package since P0-S5-T01, so the `bench` entry point exists; installed editable by `uv sync`.
package = true

[dependency-groups]
# The test runner every task's `uv run pytest` verify uses; without it `uv run` falls through to
# whatever pytest is on PATH, outside this environment. Pin and date: docs/pins.md.
dev = [
    "pytest==9.1.1",
    "jsonschema==4.26.0",   # 04 S15 item 21: fixtures validate against the GENERATED JSON Schema (P3-S1-T01)
]
