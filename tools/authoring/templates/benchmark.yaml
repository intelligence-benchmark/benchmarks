# data/benchmarks/$family/$id.yaml -- scaffolded by `bench new benchmark` on $today (05 S3).
#
# Every value marked TODO is a placeholder, and so is every value whose comment says STUB VALUE:
# a scaffold has to pass tier 1, so an enum with no null gets a legal term that is NOT a decision.
# `bench validate` (tier 3, stub-placeholder) blocks this file while any TODO, any example.invalid
# URL or the bench-new-stub tag remains. Replace each one from a cited source, then remove the tag.
id: $id
name: TODO                          # Official name, exactly as the maintainers write it. Not our paraphrase.
aliases: []                         # Every other spelling in the wild. Searchable. Include the paper's name.
tagline: TODO                       # ONE sentence, <120 chars, for a non-specialist. Shown on cards and Atlas hover.
description: null                   # Neutral register: what the task is, what it measures, known weaknesses.
                                    # No comparative or promotional language -- CI flags "state-of-the-art",
                                    # "the gold standard", "best-in-class".
domain:                             # The navigational spine (02 S3).
  primary: $domain                  # Exactly one. From taxonomy/domains.yaml, a subdomain leaf.
  secondary: []                     # Zero or more. Use when a benchmark genuinely straddles fields.
capability: []                      # Multi-valued, from taxonomy/capabilities.yaml. What ability is under test?
lifecycle: active                   # STUB VALUE: confirm against the source (taxonomy/lifecycle.yaml).
learned_entrant_evidence:           # The admissibility test (04 S5): at least one entrant is a learned system.
  - system: TODO                    # The learned entrant, named as the source names it.
    source: $source_id              # The Source that shows it entered.
    observed_on: $today             # The date YOU saw it in that source.
evaluation_target: learned-system   # STUB VALUE: learned-system | numerical-method | human-population | mixed.
data:                               # Data properties (02 S7).
  access: fully-open                # STUB VALUE: from taxonomy/data-properties.yaml; not a default, a decision.
  contamination_risk: unknown       # low|medium|high|confirmed|unknown. high or confirmed REQUIRES evidence below.
  contamination_evidence: []        # Source IDs. CI enforces this pairing -- no assertion without evidence.
  size: null                        # NEVER estimate. If unknown, leave null: a null renders as "not curated";
                                    # a guess renders as a fact, and that is the failure this project exists
                                    # to prevent. When known: {n_items: {value: <int>, unit: <text>, source: <src-id>}}.
homepage: $homepage                 # The benchmark's own page. example.invalid is a placeholder, never a URL.
tags:                               # Free text, never validated (02 S11 rule 7).
  - bench-new-stub                  # Remove once every TODO and STUB VALUE above is replaced.
curation:                           # Who curated this, when, and from what (05 S4).
  added_by: $added_by               # Your handle.
  added_on: $today                  # Today, ISO date.
  last_verified: $today             # The date YOU opened the sources, not the date you copied a field.
  verification_status: ai-drafted-unverified   # See 05 S4. Entries at this level are NOT published.
  sources:                          # At least one. No field may be filled from memory or inference.
    - $source_id
