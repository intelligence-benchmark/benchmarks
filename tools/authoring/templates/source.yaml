# data/sources/$year/$id.yaml -- scaffolded by `bench new source` on $today (04 S9, 05 S3).
#
# A non-DOI Source fails tier 1 until it is archived: `archive_url` is mandatory (04 S12), and
# `bench archive` (or the rolling archiver) writes it. Every STUB VALUE is a legal term, not a decision.
id: $id
type: documentation                 # STUB VALUE: paper | preprint | repository | leaderboard-page | dataset-card | ...
title: null                         # The page's own title, verbatim.
url: $url                           # The URL as fetched. example.invalid is a placeholder, never a URL.
doi: null                           # A DOI exempts the Source from archiving; never invent one.
archive_url: null                   # Written by the archiver, never by hand.
archive_status: pending             # pending until a capture exists (ok | pending | failed | not-required).
licence_class: unlicensed           # STUB VALUE: the licence the source states, checked on the date below.
licence_checked_on: $today          # The date YOU read the licence.
provenance: primary                 # STUB VALUE: primary | pwc-archive | hf_space_tag | vendor-doc | secondary.
notes: null
